  topic: владелец сотрудника
  question: 'Пользователь A создал сотрудника без компании, у пользователя B есть свой сотрудник: кого A увидит в списке сотрудников
    без фильтра по компании?'
  why: У сотрудника нет ссылки на владельца, поэтому правило «свои сотрудники» не на чем реализовать; от ответа зависят схема
    БД и проверки доступа ко всем операциям с сотрудниками. Отдельно нужно задать обязательные поля и диапазон age, а также
    правила защиты персональных данных сотрудников.
  where:
  - quote: Пользователи могут регистрироваться, авторизоваться и выполнять CRUD-операции над своими компаниями и сотрудниками.
    place: раздел «c4_tech_task_example › Контекст (C1)», строка 7
  - quote: company` (может быть null)
    place: раздел «Код (C4) › Требования к сущностям», строка 40
  - quote: Список сотрудников (всех или по компании).
    place: раздел «Код (C4) › Эндпоинты», строка 67
  options:
  - label: A
    text: Только своих сотрудников, включая не привязанных к компании
    change: Добавить в Employee ссылку на пользователя-владельца, задаваемую из сессии; все операции с сотрудником разрешить
      только владельцу
    for_discussion: false
  - label: B
    text: Только сотрудников своих компаний; сотрудник без компании недоступен никому
    change: Принадлежность сотрудника определять через компанию; описать, как создатель работает с сотрудником до привязки
    for_discussion: false
  - label: C
    text: 'Все сотрудники в системе общие: любой пользователь видит и меняет всех'
    change: Убрать «своими» для сотрудников; список без companyId возвращает всех сотрудников системы
    for_discussion: false
  if_unanswered: Команда добавит владельца сотрудника и покажет только своих; если сотрудники задуманы общими, придётся менять
    схему БД и тесты доступа.
