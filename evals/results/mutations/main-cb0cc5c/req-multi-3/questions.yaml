  question: 'Сохранение порога заменяет настройку, а метод указан как GET без тела: каким методом и где клиент передаёт cardId,
    amount и enabled?'
  why: GET для изменяющей операции кешируется и повторяется прокси. От выбора зависят контракт, пример CURL и тест запроса
    без Content-Type.
  where:
