  topic: ответ на неверную сумму
  question: 'Владелец карты с действующей сессией сохраняет порог amount=999: какой HTTP-код и какое тело возвращает метод?'
  why: Логика метода и пример под 200 дают 200 с ERROR, а описание 400 — код 400. От ответа зависят обработка ошибки в приложении,
    мониторинг и негативные тесты, в том числе для enabled=2.
  where:
  - quote: При отклонении суммы вернуть прежнее состояние и результат ERROR.
    place: раздел «Часть B. REST API › Логика работы метода», строка 120
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: раздел «Часть B. REST API › Статусы», строка 162
  options:
  - label: A
    text: 200 с телом {"result":"ERROR","message":"Проверьте сумму"}
    change: Сузить описание 400 до неверного формата параметров; пример ERROR оставить в разделе 200
    for_discussion: false
  - label: B
    text: 400 с телом {"message":"Некорректный запрос"}
    change: Убрать результат ERROR из логики метода и пример ERROR из раздела 200
    for_discussion: false
  - label: C
    text: 400 с телом {"result":"ERROR","message":"Проверьте сумму"}
    change: Перенести пример ERROR в раздел 400 и поправить описание поля result
    for_discussion: true
  if_unanswered: Разработчик выберет код сам; приложение может не показать ошибку под полем, а мониторинг будет считать отказы
    успехом.
