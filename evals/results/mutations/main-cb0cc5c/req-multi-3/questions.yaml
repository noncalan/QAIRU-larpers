  why: Ф-3 ограничивает число push одним в месяц, Ф-4 требует push независимо от истории. От ответа зависит, сбрасывается
    ли признак отправки при смене порога, и число push в тесте.
  where:
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: раздел «Требования к изменениям › Функциональные требования», строка 39
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: раздел «Требования к изменениям › Функциональные требования», строка 40
  options:
  - label: A
    text: 'Да: смена порога снимает ограничение, push приходит по каждому новому порогу'
    change: 'Уточнить Ф-3: «один push на настройку порога в месяце»; при смене порога сбрасывать признак отправки'
    for_discussion: false
  - label: B
    text: 'Нет: не больше одного push в месяц при любых изменениях порога'
    change: Удалить из Ф-4 «независимо от истории предыдущей настройки»
    for_discussion: false
  - label: C
    text: Да, но не больше заданного числа push в месяц
    change: Указать в Ф-3 максимальное число push в месяц и сбрасывать признак при смене порога в пределах этого числа
    for_discussion: true
  if_unanswered: Команда оставит один push в месяц; клиент, поднявший порог, не узнает о достижении нового бюджета.
  related_findings:
  - F-04
