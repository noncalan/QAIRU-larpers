  - quote: application/json
    place: раздел «Параметры запроса › Request body», строка 146
  - quote: Тело не используется.
    place: раздел «Параметры запроса › Request body», строка 147
  options:
  - label: A
    text: GET с query-параметрами, Content-Type не требуется
    change: Убрать Content-Type из раздела Request body; описать защиту от кеширования
    for_discussion: false
  - label: B
    text: PUT или POST с JSON-телом amount и enabled, Content-Type application/json обязателен
    change: Заменить REST type, описать тело запроса и ответ на запрос без Content-Type; обновить CURL
    for_discussion: false
  - label: C
    text: POST с query-параметрами без тела
    change: Заменить REST type на POST, убрать Content-Type; обновить CURL
    for_discussion: false
  if_unanswered: Команда оставит GET; прокси может повторить или закешировать сохранение, и порог изменится без действия клиента.
