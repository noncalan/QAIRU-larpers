  topic: месяц поздно проведённой покупки
  question: 'Покупка на 4 000 ₸ совершена 31 января в 23:58 по Алматы и проведена 1 февраля в 00:03: к расходам какого месяца
    она относится?'
  why: Ф-2 относит покупку к январю, а критерий приёмки R-14 — к февралю. От ответа зависят поле события, по которому считается
    месяц, push по порогу закрытого месяца и пояс «календарного месяца» для лимита одного push.
  where:
  - quote: Месяц определяется по дате совершения покупки в Алматы.
    place: раздел «Требования к изменениям › Функциональные требования», строка 38
  - quote: Февральский счётчик вырос на 4 000 ₸
    place: раздел «Часть A. Новый функционал › Критерии приемки», таблица 2, строка 2, ячейка 3, колонка «Ожидаемый результат»
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: раздел «Требования к изменениям › Функциональные требования», строка 39
  options:
  - label: A
    text: К январю; если она пересекла январский порог, push отправляется при проведении в феврале
    change: Исправить ожидаемый результат R-14 на январский счётчик; назвать поле события с моментом совершения; описать текст
      push за прошлый месяц
    for_discussion: false
  - label: B
    text: К январю; push по закрытому месяцу не отправляется
    change: Исправить R-14 на январский счётчик; добавить в Ф-3 запрет push по закрытому месяцу
    for_discussion: false
  - label: C
    text: К февралю, месяцу проведения
    change: Заменить в Ф-2 дату совершения на дату проведения по Алматы; R-14 оставить
    for_discussion: false
  if_unanswered: Команда реализует Ф-2 (январь), и критерий R-14 не пройдёт; push по январскому порогу придёт клиенту в феврале
    без пояснения.
