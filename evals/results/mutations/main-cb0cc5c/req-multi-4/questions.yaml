  why: 'Пример с ERROR стоит под кодом 200, а неверные параметры описаны как 400. После ответа нужно ещё решить: входят ли
    в тело прежние amount и enabled, обязательна ли amount при enabled=0, какой ответ при enabled не 0/1.'
  where:
