  - quote: При отклонении суммы вернуть прежнее состояние и результат ERROR.
    place: раздел «Часть B. REST API › Логика работы метода», строка 125
  options:
  - label: A
    text: 200 с result=ERROR и message «Проверьте сумму»
    change: Описать в статусе 200 оба исхода; в статусе 400 оставить только синтаксически неверные запросы
    for_discussion: false
  - label: B
    text: 400 с result=ERROR и message «Проверьте сумму»
    change: Перенести пример с ERROR под статус 400; 200 возвращать только при сохранении
    for_discussion: false
  - label: C
    text: 400 с message «Некорректный запрос», как для любых неверных параметров
    change: Удалить пример с «Проверьте сумму»; сумма вне диапазона обрабатывается как неверный параметр
    for_discussion: false
  if_unanswered: Команда вернёт 200 с ERROR по примеру; мониторинг будет считать отклонённые сохранения успешными, а негативные
    тесты по 400 упадут.
