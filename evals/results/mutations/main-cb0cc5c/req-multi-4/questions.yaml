  why: Ф-3 ограничивает push одним в месяц, а Ф-4 требует push «независимо от истории». От ответа зависят модель признака
    отправки и число push в тесте.
  where:
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: раздел «Требования к изменениям › Функциональные требования», строка 39
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: раздел «Требования к изменениям › Функциональные требования», строка 40
  options:
  - label: A
    text: Да, после смены порога возможен ещё один push в том же месяце
    change: В Ф-3 ограничение «один push в месяц для каждого значения порога»; смена порога сбрасывает признак отправки, хранить
      порог на момент отправки
    for_discussion: false
  - label: B
    text: Нет, за месяц на карту не больше одного push при любых сменах порога
    change: Из Ф-4 убрать «независимо от истории предыдущей настройки» или ограничить его месяцами без отправленного push
    for_discussion: false
  if_unanswered: Команда сохранит один признак на месяц, и второго push не будет; если ждали Ф-4, клиент не узнает о новом
    бюджете.
