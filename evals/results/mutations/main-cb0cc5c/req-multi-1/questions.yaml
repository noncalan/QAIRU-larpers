  topic: условие ответа 403
  question: 'Чужая и отсутствующая карта дают 404: в каком случае метод сохранения порога возвращает 403?'
  why: Единственное названное нарушение доступа отдано коду 404, а у 403 нет ни условия, ни тела ответа. Без этого нельзя
    написать тест на 403.
  where:
  - quote: Ответ в случае, если на указанный ресурс доступ запрещен.
    place: раздел «Статусы › 200. Successful — Created», строка 174
  - quote: Для чужой карты возвращается 404, как и для отсутствующей карты.
    place: раздел «Статусы › 403. Unsuccessful — Forbidden», строка 188
  options:
  - label: A
    text: Никогда
    change: Убрать 403 из перечня статусов
    for_discussion: false
  - label: B
    text: Для своей карты, по которой настройка запрещена (неактивная или не в KZT)
    change: Описать условие и тело ответа 403 и добавить критерий приёмки
    for_discussion: true
  - label: C
    text: Для сессии без права на изменение настроек (ограниченный токен)
    change: Описать требуемое право в Authorization и тело ответа 403
    for_discussion: true
  if_unanswered: Команда не будет возвращать 403; если он нужен для неактивных карт, настройку по ним можно будет сохранить.
  related_findings:
  - F-41
