  topic: месяц для лимита push
  question: 'В январе push уже был; покупка от 31 января, проведённая 1 февраля в 00:03, снова довела январские расходы до
    порога, в феврале push не было: отправляется ли push?'
  why: 'Неизвестно, к какому месяцу относится лимит «один push»: к месяцу расходов или к месяцу отправки. Вопрос важен, если
    покупку относят к месяцу совершения (см. вопрос о моменте учёта покупки).'
  where:
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: раздел «Требования к изменениям › Функциональные требования», строка 39
  options:
  - label: A
    text: Нет, лимит считается по месяцу расходов, а январский push уже был
    change: В Ф-3 записать «один push на месяц расходов по Ф-2»
    for_discussion: false
  - label: B
    text: Да, лимит считается по месяцу отправки по Алматы, и это первый push февраля
    change: В Ф-3 записать, что лимит считается по дате отправки, а в тексте push указывать месяц расходов
    for_discussion: true
  - label: C
    text: Нет, достижение порога в уже закончившемся месяце push не вызывает никогда
    change: 'Добавить правило: push только за текущий месяц на момент обработки события'
    for_discussion: true
  if_unanswered: Команда будет считать лимит по месяцу расходов; если ждали учёта по дате отправки, клиент не получит push
    в начале месяца.
  related_findings:
  - F-03
  answer: null
  comment: null
