  topic: ответ на неверные параметры
  question: 'Приложение сохраняет порог 500 ₸ при допустимом диапазоне 1 000–1 000 000: какой код и какое тело ответа оно
    получает?'
  why: Пример под статусом 200 и описание 400 противоречат друг другу, у негативных тестов нет одного ожидаемого ответа. Выбранный
    формат распространится на enabled вне 0/1, отсутствующий параметр и длину cardId; отдельно нужно восстановить пропущенный
    шаг 2 логики метода.
  where:
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: раздел «Часть B. REST API › Статусы», строка 162
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: раздел «Статусы › 200. Successful — Created», строка 170
  - quote: '{"message":"Некорректный запрос"}'
    place: раздел «Статусы › 400. Unsuccessful — Bad request», строка 179
  options:
  - label: A
    text: 200 и {"result":"ERROR","message":"Проверьте сумму"}, а 400 только для нераспознаваемого запроса
    change: В описании 400 перечислить случаи неверного формата; для каждой проверки значения указать ответ 200 ERROR
    for_discussion: false
  - label: B
    text: 400 и {"result":"ERROR","message":"Проверьте сумму"}, поле result есть во всех ответах с ошибкой
    change: Перенести пример под 400; добавить result=ERROR в тела 400, 401, 404, 500
    for_discussion: true
  - label: C
    text: 400 и {"message":"Некорректный запрос"}, поле result есть только в успешном ответе
    change: Удалить пример ERROR из раздела 200; в таблице ответа указать, что result только при 200
    for_discussion: false
  if_unanswered: Команда вернёт 200 с ERROR; мониторинг и клиенты, которые смотрят на код ответа, примут отклонённое сохранение
    за успешное.
  related_findings:
  - F-08
  - F-39
