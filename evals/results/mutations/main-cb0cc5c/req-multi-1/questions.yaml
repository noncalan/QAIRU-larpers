  topic: момент учёта покупки
  question: 'Покупку на 4 000 ₸ авторизовали 31 января в 23:58, а провели 1 февраля в 00:03 по Алматы: когда она попадает
    в расходы и какого месяца?'
  why: От ответа зависят событие процессинга для пересчёта расходов, ожидаемый результат R-14 (сейчас TBD) и момент, от которого
    считается минута в R-10. Время Алматы принимается по поясу Asia/Almaty.
  where:
  - quote: Месяц определяется по дате совершения покупки в Алматы.
    place: раздел «Требования к изменениям › Функциональные требования», строка 38
  - quote: В расходы входят проведённые покупки.
    place: раздел «Требования к изменениям › Функциональные требования», строка 38
  - quote: Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.
    place: раздел «Часть A. Новый функционал › Цели», строка 23
  options:
  - label: A
    text: Учитывается сразу при авторизации и относится к январю, push приходит в момент покупки
    change: В Ф-2 заменить «проведённые» на «авторизованные», описать отмену авторизации, в R-10 считать минуту от события
      авторизации, в R-14 записать январь
    for_discussion: false
  - label: B
    text: Учитывается после проведения и относится к январю по дате совершения, push может прийти позже покупки
    change: Событие процессинга передаёт дату совершения, минута в R-10 считается от события проведения, в цели убрать «в
      момент покупки», в R-14 записать январь
    for_discussion: false
  - label: C
    text: Учитывается после проведения и относится к февралю по дате проведения
    change: В Ф-2 определять месяц по дате проведения, в R-14 записать февраль
    for_discussion: false
  if_unanswered: Команда учтёт покупку после проведения в январе; если ждали учёта при авторизации, push будет приходить на
    часы или сутки позже покупки.
