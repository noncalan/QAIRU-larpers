  - label: C
    text: Событие процессинга не считается обработанным, пока push не принят, и повторяется до успеха
    change: Описать повтор события и запрет двойного учёта расходов при повторе
    for_discussion: true
  if_unanswered: Команда поставит признак после подтверждения и сделает несколько повторов; при долгом отказе клиент push
