  topic: HTTP-метод сохранения
  question: 'Прокси или клиент могут повторить и закешировать GET-запрос, который меняет порог: оставить GET с параметрами
    в строке запроса или перейти на изменяющий метод с телом JSON?'
  why: Метод меняет данные, но объявлен как GET; при этом документ одновременно требует Content-Type application/json и говорит,
    что тела нет. От ответа зависят URL, CURL, параметры и тест на запрос без Content-Type.
  where:
  - quote: GET
    place: раздел «Часть B. REST API › Общие параметры», таблица 5, строка 2, ячейка 2, колонка «Значение»
  - quote: application/json
    place: раздел «Параметры запроса › Request body», строка 146
  - quote: Тело не используется.
    place: раздел «Параметры запроса › Request body», строка 147
  options:
  - label: A
    text: Оставить GET с параметрами в строке запроса, без тела и без Content-Type, ответ не кешируется
    change: Удалить требование Content-Type; добавить запрет кеширования ответа
    for_discussion: false
  - label: B
    text: Перейти на PUT с телом JSON {amount, enabled} и cardId в пути, Content-Type application/json обязателен
    change: Переписать URL, параметры запроса и CURL; описать ответ на запрос без Content-Type
    for_discussion: false
  if_unanswered: Команда оставит GET; повтор запроса прокси может изменить настройку, а данные карты попадут в журналы URL.
