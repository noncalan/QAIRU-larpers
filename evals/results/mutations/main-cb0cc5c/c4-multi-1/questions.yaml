  why: «1:1» запрещает второго сотрудника, а список сотрудников по компании предполагает несколько. От ответа зависят ограничение
    уникальности в БД и тесты привязки и списка.
  where:
  - quote: Привязка сотрудника к компании (1:1 или null).
    place: раздел «c4_tech_task_example › Компоненты (C3)», строка 27
  - quote: Список сотрудников (всех или по компании).
    place: раздел «Код (C4) › Эндпоинты», строка 67
  options:
  - label: A
    text: 'Да: у компании может быть сколько угодно сотрудников, сотрудник — не более чем в одной компании'
    change: Заменить «1:1» на «многие к одному»; уникального ограничения на company_id нет
    for_discussion: false
  - label: B
    text: 'Нет: у компании не более одного сотрудника, вторая привязка отклоняется'
    change: Добавить уникальное ограничение на company_id и указать код ответа на вторую привязку
    for_discussion: false
  if_unanswered: Команда сделает «многие к одному». Если на самом деле нужно 1:1, в компании окажутся несколько сотрудников
    и придётся мигрировать данные.
