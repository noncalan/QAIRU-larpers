  question: 'Пользователь A запрашивает, изменяет или удаляет компанию 7, принадлежащую пользователю B: какой ответ он получает?'
  why: «Только свои» указано лишь для чтения компании, и код отказа не задан. От ответа зависят проверки во всех операциях
    по id и негативные тесты доступа. Также не перечислены прочие критерии «безопасного» бекенда, например политика сессий.
  where:
  - quote: Получить компанию по ID (только свои).
    place: раздел «Код (C4) › Эндпоинты», строка 59
  - quote: Обновить компанию.
    place: раздел «Код (C4) › Эндпоинты», строка 61
  - quote: Создать безопасный REST-бекенд
    place: раздел «c4_tech_task_example › Контекст (C1)», строка 8
  options:
  - label: A
    text: Ответ «не найдено» (404), как для несуществующего объекта; данные не меняются
    change: Записать правило «только свои» для всех операций с компанией и сотрудником по id с ответом 404
    for_discussion: false
  - label: B
    text: Ответ «доступ запрещён» (403); данные не меняются
    change: Добавить 403 в перечень кодов и записать правило «только свои» для всех операций по id
    for_discussion: true
  if_unanswered: Команда вернёт 404. Если ожидался 403, негативные тесты доступа придётся переписать.
  related_findings:
  - F-03
  - F-06
  answer: null
  comment: null
