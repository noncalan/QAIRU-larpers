  topic: владелец сотрудника
  question: 'Пользователь B создал сотрудника Петра без компании; пользователь A запрашивает список всех сотрудников: есть
    ли Пётр в ответе?'
  why: У сотрудника нет поля владельца, поэтому для непривязанного сотрудника нельзя определить, чей он. От ответа зависят
    модель данных, фильтрация списка и тесты доступа. Также не решены нужен ли GET /api/employees/{id} и обязательность и
    диапазоны полей сотрудника.
  where:
  - quote: Пользователи могут регистрироваться, авторизоваться и выполнять CRUD-операции над своими компаниями и сотрудниками.
    place: раздел «c4_tech_task_example › Контекст (C1)», строка 7
  - quote: Список сотрудников (всех или по компании).
    place: раздел «Код (C4) › Эндпоинты», строка 67
  - quote: company` (может быть null)
    place: раздел «Код (C4) › Требования к сущностям», строка 40
  options:
  - label: A
    text: Сотрудник принадлежит создавшему его пользователю; каждый видит и меняет только своих сотрудников
    change: Добавить в Employee поле владельца, заполнять его при создании; список и все операции по id фильтровать по владельцу
    for_discussion: false
  - label: B
    text: Сотрудник принадлежит владельцу своей компании; сотрудники без компании видны всем пользователям
    change: Фильтровать список по владельцу компании и отдельно описать доступ к непривязанным сотрудникам
    for_discussion: true
  - label: C
    text: 'Сотрудники общие: каждый пользователь видит всех сотрудников системы'
    change: Явно указать, что список без companyId возвращает всех сотрудников, и изменить формулировку «своими … сотрудниками»
    for_discussion: false
  if_unanswered: Команда добавит владельца сотрудника и будет показывать только своих сотрудников. Если ожидался общий список,
    придётся менять модель и тесты.
  related_findings:
  - F-01
  - F-04
  - F-05
  - F-13
  answer: null
  comment: null
