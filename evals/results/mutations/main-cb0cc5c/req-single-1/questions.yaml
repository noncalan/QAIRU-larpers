  why: Пример ERROR стоит под кодом 200, а 400 описан для неверных параметров. Тот же выбор нужен для enabled=2, пропущенного
    параметра, дробной суммы и суммы при выключенном уведомлении; не сказано и о прежнем пороге в теле ответа.
  where:
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: раздел «Часть B. REST API › Статусы», строка 163
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: раздел «Статусы › 200. Successful — Created», строка 171
  - quote: '{"message":"Некорректный запрос"}'
    place: раздел «Статусы › 400. Unsuccessful — Bad request», строка 180
  options:
  - label: A
    text: Код 200 и тело с result=ERROR и сообщением «Проверьте сумму»
    change: Записать в «Статусах», что отказ по сумме возвращает 200; код 400 только для формата запроса
    for_discussion: false
  - label: B
    text: Код 400 и тело с result=ERROR и сообщением «Проверьте сумму»
    change: Перенести пример ERROR под код 400
    for_discussion: false
  - label: C
    text: Код 400 и общее тело «Некорректный запрос»
    change: Убрать пример ERROR из кода 200; все ошибки валидации описать под кодом 400
    for_discussion: false
  if_unanswered: Команда вернёт 200 с ERROR; мониторинг посчитает отказ успехом, а ожидания тестов разойдутся с приложением.
