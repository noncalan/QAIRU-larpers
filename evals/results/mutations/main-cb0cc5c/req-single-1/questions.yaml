  topic: настройка выше расходов
  question: 'Расходы за март 60 000 ₸, и клиент включает уведомление с порогом 50 000 ₸ или снижает порог до 50 000 ₸: когда
    он получит push?'
  why: Ф-3 и Ф-4 описывают только переход «ниже порога → не ниже» при покупке. Не сказано также, копятся ли расходы и уходит
    ли push при выключенном уведомлении.
  where:
  - quote: Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push.
    place: раздел «Требования к изменениям › Функциональные требования», строка 39
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: раздел «Требования к изменениям › Функциональные требования», строка 40
  options:
  - label: A
    text: Сразу после сохранения настройки
    change: Добавить в Ф-4 отправку push при сохранении, если расходы не ниже порога; добавить критерий приёмки
    for_discussion: true
  - label: B
    text: При следующей проведённой покупке в этом месяце
    change: 'Добавить в Ф-3 правило: первая покупка после сохранения при расходах не ниже порога вызывает push'
    for_discussion: true
  - label: C
    text: В этом месяце push не приходит, потому что перехода через порог не было
    change: Добавить в Ф-4 явное правило и критерий приёмки «push не отправлен»
    for_discussion: false
  if_unanswered: Команда не отправит push до следующего месяца; клиент, включивший уведомление после перерасхода, не получит
    сигнала и сочтёт функцию сломанной.
