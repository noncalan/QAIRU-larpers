  question: 'Расходы достигли порога, но сервис уведомлений не принял push: что делает система?'
  why: На схеме нет ветки ошибки. От ответа зависят повторы, момент записи признака отправки и число push в месяце; что фиксируется
    в журнале, тоже не сказано.
  where:
  - quote: Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение.
    place: раздел «Требования к изменениям › BPMN схема процесса», строка 34
  options:
  - label: A
    text: Повторяет отправку несколько раз, признак отправки ставит после успешного приёма
    change: Задать на схеме число и интервал повторов и поведение после последней неудачи
    for_discussion: true
  - label: B
    text: Не повторяет, ставит признак отправки, и в этом месяце push больше не будет
    change: Добавить на схему ветку «ошибка → признак поставлен → завершение»
    for_discussion: true
  - label: C
    text: Не повторяет и не ставит признак, push можно отправить при следующей покупке месяца
