  topic: владелец сотрудника
  question: Пользователь A создал сотрудника Иванова без компании; пользователь B запрашивает список сотрудников без фильтра
    — видит ли B Иванова и может ли изменить или удалить его?
  why: У сотрудника нет связи с владельцем, поэтому сотрудник без компании ничей. От ответа зависят модель данных, список
    «всех» и проверка доступа к персональным данным. Отдельно не заданы обязательность полей (middleName, gender) и допустимый
    диапазон age.
  where:
  - quote: Пользователи могут регистрироваться, авторизоваться и выполнять CRUD-операции над своими компаниями и сотрудниками.
    place: раздел «c4_tech_task_example › Контекст (C1)», строка 7
  - quote: company` (может быть null)
    place: раздел «Код (C4) › Требования к сущностям», строка 40
  - quote: Список сотрудников (всех или по компании).
    place: раздел «Код (C4) › Эндпоинты», строка 67
  options:
  - label: A
    text: Сотрудник принадлежит создавшему его пользователю; B не видит Иванова и не может его менять
    change: Добавить в Employee поле владельца user; список без companyId возвращает всех сотрудников текущего пользователя,
      включая непривязанных
    for_discussion: false
  - label: B
    text: Сотрудник принадлежит владельцу своей компании; сотрудники без компании видны и доступны всем пользователям
    change: Владельца у Employee не добавлять; список без companyId возвращает сотрудников своих компаний и всех непривязанных
    for_discussion: true
  - label: C
    text: Список без фильтра возвращает всех сотрудников системы, любой пользователь может их менять
    change: Ограничения по владельцу для сотрудников не вводить; описать это явно в разделе «Эндпоинты»
    for_discussion: false
  if_unanswered: Команда добавит владельца-создателя. Если имелся в виду общий справочник, пользователи не увидят сотрудников
    друг друга.
  related_findings:
  - F-01
  - F-04
  - F-13
  answer: null
  comment: null
