  topic: компания в теле сотрудника
  question: Клиент передаёт companyId при создании сотрудника или не передаёт его при обновлении сотрудника 5, привязанного
    к компании 1 — как меняется привязка?
  why: Тело создания задано через «...», и неясно, входит ли привязка в создание и обновление или меняется только отдельным
    запросом. От ответа зависят схемы запросов и тесты привязки.
  where:
  - quote: 'Создать сотрудника: `{ "firstName": "Иван", "age": 30, ... }`.'
    place: раздел «Код (C4) › Эндпоинты», строка 69
  - quote: Обновить сотрудника.
    place: раздел «Код (C4) › Эндпоинты», строка 73
  - quote: 'Привязать к компании: `{ "companyId": 1 }` (или null).'
    place: раздел «Код (C4) › Эндпоинты», строка 71
  options:
  - label: A
    text: Привязка меняется только отдельным запросом привязки; companyId в создании и обновлении игнорируется, привязка сохраняется
    change: Перечислить поля тела создания и обновления без companyId; указать, что привязка меняется только через PATCH /api/employees/{id}/company
    for_discussion: false
  - label: B
    text: companyId входит в тело создания и обновления; при обновлении без companyId сотрудник отвязывается
    change: Добавить companyId в оба тела; описать отвязку при отсутствии поля
    for_discussion: true
  - label: C
    text: companyId в теле создания и обновления запрещён, запрос с ним отклоняется с ошибкой валидации
    change: Добавить отказ 400 при наличии companyId в теле
    for_discussion: true
  if_unanswered: Команда будет игнорировать companyId в создании и обновлении. Клиент, который передаёт компанию при создании,
    получит непривязанного сотрудника.
  related_findings:
  - F-20
  - F-24
  answer: null
  comment: null
