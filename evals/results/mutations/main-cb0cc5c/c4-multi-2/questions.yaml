  topic: доступ к чужому объекту
  question: Пользователь B запрашивает, изменяет или удаляет компанию 1 пользователя A — какой ответ он получает?
  why: Ограничение «только свои» указано лишь для GET компании, код отказа не задан. От ответа зависят проверка доступа во
    всех операциях с компаниями и сотрудниками и ожидаемый результат тестов изоляции.
  where:
  - quote: Получить компанию по ID (только свои).
    place: раздел «Код (C4) › Эндпоинты», строка 59
  - quote: Глобальная обработка исключений с возвратом структурированных ошибок (HTTP 400, 404, 409).
    place: раздел «Код (C4) › Технические требования», строка 79
  options:
  - label: A
    text: Ответ 404, как будто объекта нет; чужой объект неотличим от несуществующего
    change: Распространить «только свои» на все операции с компаниями и сотрудниками; задать 404 для чужого объекта
    for_discussion: false
  - label: B
    text: 'Ответ 403: объект существует, но доступ запрещён'
    change: Распространить «только свои» на все операции; добавить 403 в перечень ошибок
    for_discussion: true
  if_unanswered: Команда вернёт 404. Если ожидался 403, критерии приёмки по безопасности придётся переписать.
  related_findings:
  - F-03
  answer: null
  comment: null
