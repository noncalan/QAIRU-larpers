  topic: CSRF-защита
  question: Клиент с действующей сессионной cookie отправляет запрос на создание компании без CSRF-токена — запрос выполняется
    или отклоняется?
  why: При сессионной cookie решение о CSRF определяет, примет ли сервер любой изменяющий запрос и как клиент получает токен.
    Не заданы также формат тела входа (JSON или форма) и ответ на неверный пароль.
  where:
  - quote: Вход (устанавливает session cookie).
    place: раздел «Код (C4) › Эндпоинты», строка 47
  - quote: Создать безопасный REST-бекенд с использованием Spring Boot 3.4, Hibernate 6, PostgreSQL и Flyway.
    place: раздел «c4_tech_task_example › Контекст (C1)», строка 8
  options:
  - label: A
    text: 'CSRF-защита включена: без токена запрос отклоняется, токен клиент получает в cookie и передаёт в заголовке'
    change: Описать выдачу токена (cookie XSRF-TOKEN, заголовок X-XSRF-TOKEN) и ответ 403 без токена
    for_discussion: false
  - label: B
    text: CSRF-защита отключена, запрос выполняется; защиту даёт атрибут cookie SameSite
    change: Указать, что CSRF отключён, и задать SameSite для cookie сессии
    for_discussion: true
  if_unanswered: Команда оставит CSRF включённым по умолчанию Spring Security. Клиенты без токена получат отказ на все изменяющие
    запросы.
  related_findings:
  - F-05
  - F-16
  - F-17
  answer: null
  comment: null
- id: Q-05
