  topic: сотрудников у компании
  question: К компании 1 уже привязан сотрудник 10; пользователь привязывает к ней же сотрудника 11 — привязка проходит?
  why: «1:1» противоречит списку сотрудников компании и условию удаления «если нет сотрудников». От ответа зависят ограничение
    уникальности на company_id и ожидаемый результат теста привязки.
  where:
  - quote: Привязка сотрудника к компании (1:1 или null).
    place: раздел «c4_tech_task_example › Компоненты (C3)», строка 27
  - quote: Список сотрудников (всех или по компании).
    place: раздел «Код (C4) › Эндпоинты», строка 67
  - quote: Удалить компанию (если нет сотрудников).
    place: раздел «Код (C4) › Эндпоинты», строка 63
  options:
  - label: A
    text: 'Проходит: у компании может быть любое число сотрудников, у сотрудника не больше одной компании'
    change: Заменить «1:1» на «многие к одному (N:1)»; уникального ограничения на company_id нет
    for_discussion: false
  - label: B
    text: 'Не проходит: у компании может быть только один сотрудник'
    change: Добавить уникальное ограничение на company_id и код отказа при занятой компании; переписать список «по компании»
      как получение одного сотрудника
    for_discussion: false
  if_unanswered: Команда сделает связь N:1. Если имелось в виду 1:1, к одной компании окажутся привязаны несколько сотрудников.
  related_findings:
  - F-02
  answer: null
  comment: null
