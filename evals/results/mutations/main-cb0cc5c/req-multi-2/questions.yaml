  topic: чтение настроек и суммы
  question: 'Клиент открывает экран уведомлений: каким методом приложение получает текущий порог, переключатель и сумму за
    месяц, если в части B описан только saveLimit?'
  why: Контракта чтения нет, а у saveLimit в описании одновременно «сохранение» и «чтение». Без ответа нельзя реализовать
    экран и написать контрактный тест.
  where:
  - quote: Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».
    place: раздел «Часть A. Новый функционал › Требования к интеграции», строка 54
  - quote: Сохранение порога.
    place: раздел «Часть B. REST API › Общие параметры», таблица 5, строка 1, ячейка 2, колонка «Значение»
  - quote: 'Функциональные требования: чтение порога'
    place: раздел «Часть B. REST API › Общие параметры», таблица 5, строка 1, ячейка 2, колонка «Значение»
  options:
  - label: A
    text: Отдельным методом чтения, а saveLimit только сохраняет
    change: Добавить в часть B метод чтения с полями порога, переключателя и суммы за месяц; в saveLimit исправить строку
      требований на Ф-1, Ф-4
    for_discussion: false
  - label: B
    text: 'Тем же saveLimit: без amount и enabled он возвращает текущую настройку и сумму за месяц'
    change: Описать в части B режим чтения saveLimit, сделать amount и enabled необязательными, добавить сумму за месяц в
      ответ
    for_discussion: false
  - label: C
    text: Методом из другого документа, вне этой части B
    change: Дать ссылку на документ метода чтения и убрать «чтение порога» из описания saveLimit
    for_discussion: true
  if_unanswered: Команда добавит свой метод чтения без согласования; приложение и бэкенд разойдутся по контракту.
