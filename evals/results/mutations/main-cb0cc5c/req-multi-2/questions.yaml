  topic: месяц покупки на стыке
  question: 'Покупка на 4 000 ₸ совершена 31 января в 23:58, а проведена 1 февраля в 00:03 по Алматы: в расходы какого месяца
    она попадает?'
  why: Ф-2 относит покупку к январю, а критерий приёмки — к февралю. От этого зависят ключ месяца в учёте, лимит push и ожидаемый
    результат основного граничного теста.
  where:
