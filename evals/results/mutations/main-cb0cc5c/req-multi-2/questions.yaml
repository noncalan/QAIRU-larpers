    place: раздел «Требования к изменениям › Функциональные требования», строка 38
  - quote: Февральский счётчик вырос на 4 000 ₸
    place: раздел «Часть A. Новый функционал › Критерии приемки», таблица 2, строка 2, ячейка 3, колонка «Ожидаемый результат»
  options:
  - label: A
    text: В январь — по дате совершения покупки
    change: 'Исправить критерий приёмки: январский счётчик вырос на 4 000 ₸, февральский не изменился'
    for_discussion: false
  - label: B
    text: В февраль — по дате проведения покупки
    change: 'Изменить Ф-2: месяц определяется по дате проведения покупки по Алматы'
    for_discussion: false
  if_unanswered: Команда реализует Ф-2 (январь), и критерий приёмки упадёт; если нужен февраль, счётчики разойдутся с ожиданием
    бизнеса.
