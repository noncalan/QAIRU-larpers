  topic: ответ на неверную сумму
  question: 'Приложение сохраняет порог amount=999 для своей карты: какой HTTP-статус и какое тело ответа?'
  why: Пример ответа ERROR стоит в разделе 200, а неверные параметры по перечню дают 400. По тому же правилу решаются enabled
    не 0/1, дробная, отрицательная или отсутствующая сумма и неверный cardId.
  where:
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: раздел «Часть B. REST API › Статусы», строка 167
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: раздел «Статусы › 200. Successful — Created», строка 175
  options:
  - label: A
    text: 200 с телом result ERROR и message «Проверьте сумму»
    change: Указать в «Статусах», что ошибки проверки суммы и переключателя возвращаются под 200 с result ERROR; 400 — только
      для неразборчивого запроса
    for_discussion: false
  - label: B
    text: 400 с телом message «Некорректный запрос»
    change: Перенести пример ERROR из раздела 200 и убрать значение ERROR из result
    for_discussion: false
  - label: C
    text: 400 с телом result ERROR и сообщением о конкретном параметре
    change: Перенести пример ERROR в раздел 400 и задать текст message для каждого неверного параметра
    for_discussion: true
  if_unanswered: Команда вернёт 200 с ERROR, как в примере; мониторинг будет считать отказы успехом, а контрактные тесты на
    400 упадут.
