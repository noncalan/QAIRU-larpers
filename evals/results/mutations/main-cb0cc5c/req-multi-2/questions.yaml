  question: 'Порог достигнут, но сервис уведомлений недоступен 10 минут: получит ли клиент push после восстановления сервиса?'
  why: Не заданы повторы и момент, когда ставится признак отправки, поэтому push может потеряться или уйти дважды. Отдельно
    нужно указать источник признака включения и поведение карты без настройки.
  where:
  - quote: 'Сервис расходов → настройки: получить порог карты.'
    place: раздел «Часть A. Новый функционал › Sequence Diagram», строка 43
  - quote: Сервис передаёт push на отправку в течение минуты после получения события.
    place: раздел «Часть A. Новый функционал › Нефункциональные требования», строка 46
  options:
  - label: A
    text: 'Да: сервис повторяет передачу до успеха, признак отправки ставится после успешной передачи'
    change: Добавить ветку ошибки в схему процесса, число и интервал повторов, правило установки признака отправки
    for_discussion: true
  - label: B
    text: Да, но только если передача удалась в течение минуты; позже push не отправляется
    change: Ограничить повторы сроком из НФТ; после срока ставить признак отправки и фиксировать потерю
    for_discussion: false
  - label: C
    text: 'Нет: при ошибке push теряется, признак отправки всё равно ставится'
    change: Добавить ветку ошибки без повторов и описать её в критериях приёмки
    for_discussion: true
  if_unanswered: Каждый разработчик реализует повторы по-своему; клиент рискует не получить push или получить его дважды.
