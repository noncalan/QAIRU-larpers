  topic: верхняя граница порога
  question: 'Клиент сохраняет порог 1 500 000 ₸ для своей активной карты в тенге: порог принимается или отклоняется?'
  why: 'Ф-1 и раздел тестирования задают разный максимум, поэтому у граничного теста и у проверки в API нет одного результата.
    Отдельно нужны решения: какая сумма учитывается по валютной покупке, что делать с заблокированной или перевыпущенной картой
    и какой ответ давать по неактивной карте.'
  where:
  - quote: Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно.
    place: раздел «Требования к изменениям › Функциональные требования», строка 37
  - quote: Держатель активной карты KZT задаёт целый порог от 1 000 до 2 000 000 ₸ включительно.
    place: раздел «Требования к тестированию › Тестирование требований», строка 61
  options:
  - label: A
    text: Максимальный порог — 1 000 000 ₸, 1 500 000 ₸ отклоняется
    change: Удалить R-14; граничные тесты — 1 000 000 и 1 000 001 ₸; ограничение amount в API не менять
    for_discussion: false
  - label: B
    text: Максимальный порог — 2 000 000 ₸, 1 500 000 ₸ сохраняется
    change: Исправить Ф-1 и ограничение amount в части B на 1 000–2 000 000; граничные тесты — 2 000 000 и 2 000 001 ₸
    for_discussion: false
  if_unanswered: Команда примет максимум 1 000 000 ₸, как в Ф-1 и API; если нужен 2 000 000 ₸, клиенты не смогут задать порог
    выше миллиона.
  related_findings:
