  topic: момент учёта покупки
  question: 'Расходы 48 500 ₸, порог 50 000 ₸, покупка на 1 500 ₸ авторизована 10 марта, клиринг прошёл 12 марта: когда клиент
    получит push?'
  why: Не определено, какое событие процессинга делает покупку «проведённой». От этого зависят подписка на события, момент
    push, поле с датой совершения и обработка отменённой авторизации.
  where:
  - quote: В расходы входят проведённые покупки.
    place: раздел «Требования к изменениям › Функциональные требования», строка 38
  - quote: Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.
    place: раздел «Часть A. Новый функционал › Цели», строка 23
  options:
  - label: A
    text: '10 марта: покупка учитывается при авторизации, отмена авторизации уменьшает расходы'
    change: Определить «проведённую» покупку как авторизованную; добавить правило для отмены авторизации и события процессинга
      в диаграмму
    for_discussion: false
  - label: B
    text: '12 марта: покупка учитывается только после клиринга'
    change: Определить «проведённую» покупку как прошедшую клиринг; уточнить в цели, что push приходит после клиринга, а не
      в момент покупки
    for_discussion: false
  if_unanswered: Команда будет учитывать покупку после клиринга, и push придёт через дни после покупки — цель «в момент покупки»
    не выполнится.
