  topic: push после смены порога
  question: 'В марте push по порогу 50 000 ₸ уже пришёл, 12 марта клиент поднял порог до 100 000 ₸, 20 марта расходы его достигли:
    будет ли второй push за март?'
  why: Ф-3 ограничивает число push одним в месяц, а Ф-4 требует push «независимо от истории». От ответа зависит, сбрасывает
    ли смена порога признак отправки, и ожидаемое число push в тесте.
  where:
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: раздел «Требования к изменениям › Функциональные требования», строка 39
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: раздел «Требования к изменениям › Функциональные требования», строка 40
  options:
  - label: A
    text: 'Да: смена порога сбрасывает признак отправки текущего месяца'
    change: 'В Ф-3 добавить исключение: после изменения порога допускается ещё один push по новому порогу'
    for_discussion: false
  - label: B
    text: 'Нет: в месяц не больше одного push, даже после смены порога'
    change: В Ф-4 убрать «независимо от истории» и уточнить, что действует месячный лимит Ф-3
    for_discussion: false
  if_unanswered: Разработчик выберет правило наугад; клиент, поднявший порог, либо не узнает о новом пороге, либо получит
    неожиданный второй push.
