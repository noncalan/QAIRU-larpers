  topic: сбой отправки push
  question: 'Покупка перевела расходы через порог, но сервис push не принял передачу: что происходит с push за этот месяц?'
  why: На схеме и диаграмме нет веток сбоя, поэтому неизвестно, когда ставится признак отправки и будет ли push вообще. Так
    же не описан отказ сервиса настроек при обработке покупки.
  where:
  - quote: Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение.
    place: раздел «Требования к изменениям › BPMN схема процесса», строка 34
  - quote: 'Сервис расходов → настройки: получить порог карты.'
    place: раздел «Часть A. Новый функционал › Sequence Diagram», строка 43
  options:
  - label: A
    text: Передача повторяется ограниченное число раз, признак ставится только после успеха
    change: Задать число и интервал повторов, действие после исчерпания попыток; добавить ветку на схему
    for_discussion: true
  - label: B
    text: Повторов нет, признак не ставится, push может вызвать следующий переход порога
    change: 'Добавить ветку на схему: при сбое признак отправки остаётся снятым'
    for_discussion: true
  - label: C
    text: Повторов нет, признак ставится, push за месяц теряется
    change: 'Добавить ветку на схему и критерий: при сбое push за месяц не отправляется'
    for_discussion: true
  if_unanswered: Команда поставит признак до передачи; при сбое сервиса push клиент не узнает о достижении бюджета, а повторить
    отправку будет нельзя.
  related_findings:
  - F-10
  - F-20
