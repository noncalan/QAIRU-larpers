  question: 'Сохранение порога меняет настройку: метод остаётся GET с параметрами в строке запроса или становится запросом
    с JSON-телом?'
  why: GET для изменяющей операции допускает кеширование и автоматические повторы, а Content-Type объявлен при отсутствии
    тела. От выбора зависят контракт, тесты повторов и проверка заголовка.
  where:
  - quote: GET
    place: раздел «Часть B. REST API › Общие параметры», таблица 5, строка 2, ячейка 2, колонка «Значение»
  - quote: Тело не используется.
    place: раздел «Параметры запроса › Request body», строка 147
  - quote: Content-Type:** `application/json` .
    place: раздел «Параметры запроса › Request body», строка 146
  options:
  - label: A
    text: Остаётся GET с параметрами в строке запроса, ответ не кешируется
    change: Добавить запрет кеширования; удалить требование Content-Type
    for_discussion: false
  - label: B
    text: Становится PUT или POST, параметры в JSON-теле
    change: Заменить REST type и CURL; описать тело запроса; Content-Type обязателен, без него — 400
    for_discussion: true
  if_unanswered: Команда оставит GET; прокси или клиент могут вернуть закешированный ответ без сохранения или повторить сохранение.
