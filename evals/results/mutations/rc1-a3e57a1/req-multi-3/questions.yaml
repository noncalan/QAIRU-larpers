  question: 'Приложение сохраняет порог 50 000 ₸ для карты demo-42: каким HTTP-методом и где передаются cardId, amount и enabled?'
  why: Изменяющая операция описана как GET, а Content-Type application/json противоречит отсутствию тела. От ответа зависят
    контракт, кеширование, журналы прокси и ответ на запрос без заголовка.
  where:
