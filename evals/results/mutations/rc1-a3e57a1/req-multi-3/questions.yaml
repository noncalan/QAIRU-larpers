    place: таблица 5, строка 2, ячейка 2, колонка «Значение»
  - quote: application/json
    place: строка 146
  - quote: Тело не используется.
    place: строка 147
  options:
  - label: A
    text: GET, параметры в строке запроса, тело и Content-Type не нужны
    change: Убрать Content-Type из Request body
    for_discussion: false
  - label: B
    text: POST или PUT, параметры в теле JSON, Content-Type application/json обязателен
    change: Сменить REST type, перенести параметры в Request body, описать ответ на запрос без Content-Type
    for_discussion: false
  - label: C
    text: POST или PUT, параметры в строке запроса, тело не используется
    change: Сменить REST type, убрать Content-Type
    for_discussion: false
