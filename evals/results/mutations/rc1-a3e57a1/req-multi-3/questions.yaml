  topic: push после смены порога
  question: 'Порог 20 000 ₸; 10 марта push при 25 000 ₸, 15 марта порог изменён на 30 000 ₸, 20 марта расходы 31 000 ₸: отправить
    второй push за март?'
  why: Ф-3 ограничивает push одним в месяц, Ф-4 требует push после смены порога независимо от истории. От ответа зависит,
    сбрасывает ли смена порога признак отправки.
  where:
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: строка 39
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: строка 40
  options:
  - label: A
    text: 'Да: смена порога сбрасывает признак отправки за месяц'
    change: В Ф-3 уточнить лимит «один push на значение порога»; признак сбрасывать при сохранении порога
    for_discussion: false
  - label: B
    text: 'Нет: в месяц не больше одного push при любых изменениях'
    change: Убрать из Ф-4 «независимо от истории предыдущей настройки»
    for_discussion: false
  if_unanswered: Команда выберет одно правило произвольно; тест смены порога упадёт при любом выборе, если бизнес ждал другого.
  related_findings:
