  question: 'Владелец карты demo-42 с порогом 20 000 ₸ сохраняет порог 999 ₸: какой HTTP-код и тело возвращает метод?'
  why: Логика метода и пример дают 200 с result=ERROR, описание статуса 400 — 400 с «Некорректный запрос». От этого зависят
    обработка ошибки в приложении и мониторинг; так же решится ответ на enabled=2.
  where:
  - quote: При отклонении суммы вернуть прежнее состояние и результат ERROR.
    place: строка 120
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: строка 162
  options:
  - label: A
    text: 200 с {"result":"ERROR","message":"Проверьте сумму"}
    change: Сузить 400 до ошибок формата; правило отклонения суммы оставить
    for_discussion: false
  - label: B
    text: 400 с {"message":"Некорректный запрос"}
    change: Убрать пример ERROR из раздела 200, отклонение суммы описать через 400
    for_discussion: false
  - label: C
    text: 400 с {"result":"ERROR","message":"Проверьте сумму"}
    change: Перенести пример ERROR в раздел 400 и описать оба текста ошибки
    for_discussion: true
  if_unanswered: Команда вернёт 200 с ERROR; мониторинг посчитает отказы успехом, а приложение может не показать ошибку.
