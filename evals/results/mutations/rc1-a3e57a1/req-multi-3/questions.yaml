    for_discussion: false
  - label: B
    text: 201 при первом сохранении, 200 при замене настройки
    change: Описать условие 201 и добавить раздел статуса 201
    for_discussion: false
  if_unanswered: Команда вернёт всегда 200; если приложение ждёт 201 при первом сохранении, оно сочтёт ответ неожиданным.
