  topic: лимит push за месяц
  question: 'В марте push о пороге 50 000 ₸ уже пришёл, клиент поднял порог до 60 000 ₸, расходы дошли до 61 000 ₸: приходит
    ли второй push?'
  why: 'Ф-3 ограничивает число push одним в месяц, а Ф-4 велит слать push после смены порога. От этого зависят хранение признака
    отправки и число push в тесте. Отдельно нужно решить, к какому месяцу привязан лимит при запоздавшей покупке: к месяцу
    покупки или к месяцу отправки.'
  where:
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: строка 39
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: строка 40
  options:
  - label: A
    text: 'Да: смена порога сбрасывает признак отправки, лимит — один push на каждое значение порога в месяце'
    change: 'Уточнить Ф-3: «один push за месяц для действующего порога»; сохранение нового порога сбрасывает признак отправки'
    for_discussion: false
  - label: B
    text: 'Нет: за месяц не больше одного push, смена порога лимит не сбрасывает'
    change: 'Уточнить Ф-4: после смены порога push приходит, только если в этом месяце push ещё не было'
    for_discussion: false
  if_unanswered: Команда сделает строгий лимит «один push в месяц». Клиент, который поднял порог, не узнает о достижении нового.
