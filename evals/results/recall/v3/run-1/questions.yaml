  topic: push при смене настройки
  question: 'Расходы марта 52 000 ₸, push в марте не было, клиент сохраняет порог 50 000 ₸ с включённым уведомлением: когда
    приходит push?'
  why: Ф-3 не учитывает переключатель, Ф-4 описывает только случай «сумма ниже нового порога». От ответа зависят ветки BPMN
    для выключенного уведомления и для уже достигнутого порога, а также ожидаемый push в тестах на включение и снижение порога.
  where:
  - quote: Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push.
    place: строка 39
  - quote: По умолчанию уведомление выключено.
    place: строка 37
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: строка 40
  options:
  - label: A
    text: Сразу после сохранения настройки
    change: Добавить в Ф-4 проверку порога при сохранении; в BPMN — ветку «сохранение настройки»
    for_discussion: true
  - label: B
    text: При следующей проведённой покупке в марте
    change: 'Дополнить Ф-3: push при первой покупке, если расходы не ниже порога и push в месяце не было'
    for_discussion: true
  - label: C
    text: 'В марте не приходит: push только при переходе расходов через порог снизу при включённом уведомлении'
    change: Добавить в Ф-3 условие «уведомление включено» и явно указать, что пересечение при выключенном уведомлении push
      не вызывает
    for_discussion: false
  if_unanswered: Команда будет ждать пересечения снизу; клиент, включивший уведомление после достижения порога, не узнает
    о нём до следующего месяца.
