  topic: ответ на неверную сумму
  question: 'Владелец карты с действующей сессией сохраняет порог 999 ₸: метод отвечает HTTP 400 или HTTP 200 с result=ERROR?'
  why: Описание статусов даёт 400, пример под заголовком 200 даёт ERROR. От ответа зависят обработка ошибок в приложении,
    мониторинг и коды для прочих ошибок проверки (enabled не 0/1, нет параметра). Нужно также решить, есть ли в теле ERROR
    прежние amount и enabled.
  where:
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: строка 163
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: строка 171
  options:
  - label: A
    text: HTTP 200 с result=ERROR и message для любой ошибки проверки параметров
    change: Убрать из 400 «параметры запроса заполнены неверно», описать все ошибки проверки как 200 ERROR
    for_discussion: false
  - label: B
    text: HTTP 400 для любой ошибки проверки, включая сумму вне диапазона
    change: Перенести пример с result=ERROR в раздел 400 и убрать его из раздела 200
    for_discussion: false
  - label: C
    text: HTTP 200 ERROR для суммы вне диапазона, HTTP 400 для некорректного запроса (нет параметра, нечисловое значение,
      enabled не 0/1)
    change: Разделить ошибки на бизнес-проверку и формат запроса, описать для каждой код и тело
    for_discussion: true
  if_unanswered: Приложение и бэкенд обработают ошибку по разным правилам; клиент не увидит сообщение под полем или мониторинг
    сочтёт ошибку успехом.
  related_findings:
