    place: строка 23
  - quote: В расходы входят проведённые покупки.
    place: строка 38
  options:
  - label: A
    text: 10 марта, при авторизации покупки
    change: Учитывать авторизации в расходах, добавить правило для отменённой авторизации, изменить Ф-2 и BPMN
    for_discussion: false
  - label: B
    text: 12 марта, после проведения покупки
