  question: 'Клиент сохраняет для своей карты порог 999 ₸: какой HTTP-код и какое тело ответа возвращает метод сохранения?'
  why: 'Документ даёт два ответа: 400 с «Некорректный запрос» и 200 с ERROR «Проверьте сумму». От этого же выбора зависят
    ответы на enabled=2, нечисловой или отсутствующий amount и несколько ошибок сразу.'
  where:
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: строка 163
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: строка 171
  options:
  - label: A
    text: 200 с result ERROR и «Проверьте сумму»; 400 — только для ошибок формата и пропущенных параметров
    change: 'В разделе «Статусы» разграничить: сумма вне диапазона — 200 ERROR, ошибки формата — 400; перечислить случаи для
      каждого'
    for_discussion: false
  - label: B
    text: 400 с «Некорректный запрос» для любого неверного параметра, включая сумму вне диапазона
    change: Убрать образец ERROR из раздела 200; result=ERROR не используется
    for_discussion: false
  - label: C
    text: 400 с result ERROR и сообщением по конкретному полю, например «Проверьте сумму»
    change: Перенести образец ERROR в раздел 400; задать сообщение для каждого параметра
    for_discussion: true
