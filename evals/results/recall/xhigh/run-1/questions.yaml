    place: строка 40
  options:
  - label: A
    text: 'Нет: в месяц на карту уходит не больше одного push, смена порога лимит не сбрасывает'
    change: Убрать из Ф-4 «независимо от истории предыдущей настройки» или уточнить, что это действует, только если push в
