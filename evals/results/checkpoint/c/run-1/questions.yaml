  topic: чтение настроек
  question: 'Клиент открывает экран «Уведомления»: через какой метод приложение получает текущий порог, состояние переключателя
    и сумму расходов за месяц?'
  why: Часть B описывает только сохранение, а Description упоминает чтение. Без метода чтения экран нельзя реализовать, и
    не определено, расходы за какой период показываются.
  where:
  - quote: На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить».
    place: строка 29
  - quote: 'Сохранение порога. Функциональные требования: чтение порога'
    place: таблица 5, строка 1, ячейка 2, колонка «Значение»
  - quote: Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».
    place: строка 52
  options:
  - label: A
    text: Отдельный метод чтения в части B возвращает порог, переключатель и расходы за текущий месяц
    change: Добавить в часть B метод чтения с полями и статусами; Description saveLimit — только сохранение
    for_discussion: true
  - label: B
    text: Тот же метод saveLimit без amount и enabled возвращает текущую настройку и расходы
    change: Описать режим чтения в логике метода и сделать amount и enabled необязательными
    for_discussion: false
  - label: C
    text: Чтение описано в другом документе, часть B — только сохранение
    change: Дать ссылку на документ чтения в разделе интеграции; убрать «чтение порога» из Description
    for_discussion: true
  if_unanswered: Приложение не сможет показать текущие настройки и сумму; команда придумает свой метод, не согласованный со
    смежными системами.
