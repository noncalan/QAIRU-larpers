    place: строка 163
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: строка 171
  options:
  - label: A
    text: 200 с result=ERROR и сообщением для любого неверного значения
    change: Статус 400 оставить только для отсутствующих или нечисловых параметров
    for_discussion: false
  - label: B
    text: 400 для любого неверного значения amount или enabled
    change: Убрать пример ERROR из раздела 200 и перенести его в раздел 400
    for_discussion: false
  - label: C
    text: Сумма вне диапазона — 200 с result=ERROR; неверный enabled или нечисловое значение — 400
    change: Описать в логике метода оба случая с текстами сообщений
    for_discussion: true
