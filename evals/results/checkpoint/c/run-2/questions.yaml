  topic: момент учёта покупки
  question: 'Покупку на 10 000 ₸ одобрили 5 марта, а банк провёл её 7 марта: в какой момент она попадает в расходы и может
    вызвать push?'
  why: Цель обещает уведомление «в момент покупки», а Ф-2 учитывает «проведённые» покупки, которые проводятся позже. От выбора
    зависят источник событий, судьба отменённых авторизаций, сумма в ₸ для покупок в валюте и ожидаемое время push в тестах.
  where:
  - quote: Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.
    place: строка 23
  - quote: В расходы входят проведённые покупки.
    place: строка 38
  - quote: Сервис передаёт push на отправку в течение минуты после получения события.
    place: строка 46
  options:
  - label: A
    text: При одобрении покупки (авторизации); отменённая авторизация уменьшает расходы
    change: Переписать Ф-2.2 и цель; добавить правило для отмены авторизации и курса валюты на момент авторизации
    for_discussion: false
  - label: B
    text: После проведения покупки банком; push приходит после проведения, а не во время покупки
    change: Уточнить в цели, что уведомление приходит после проведения; сумма в ₸ берётся из проведённой операции
    for_discussion: false
  if_unanswered: Команда будет учитывать покупку после проведения; клиент получит push через сутки и позже, и цель «в момент
    покупки» не будет достигнута.
  related_findings:
