  topic: перечень статусов, код 403
  question: Если по чужой карте метод отвечает 404, в каком случае он возвращает 403?
  why: Код 403 описан, но чужая карта получает 404, а 404 нет в перечнях статусов. Без закрытого перечня кодов тест контроля
    доступа не имеет одного ожидаемого кода.
  where:
  - quote: Ответ в случае, если на указанный ресурс доступ запрещен.
    place: строка 175
  - quote: Для чужой карты возвращается 404, как и для отсутствующей карты.
    place: строка 189
  - quote: Если результат 400, 401 и далее — неуспешный.
    place: строка 151
  options:
  - label: A
    text: 'Код 403 не используется; статусы: 200, 400, 401, 404, 500'
    change: Удалить 403, вынести пример 404 в отдельный раздел и заменить «и далее» закрытым перечнем
    for_discussion: false
  - label: B
    text: 403 для чужой карты, 404 только для отсутствующей
    change: Исправить правило R-43 и добавить 404 в перечень статусов
    for_discussion: false
  - label: C
    text: 403 для своей карты, недоступной для настройки (неактивна или не в KZT), 404 для чужой и отсутствующей
    change: Описать условие 403 и добавить 404 в перечень статусов
    for_discussion: true
  if_unanswered: Команда исключит 403. Если ИБ ждала 403 для отдельного случая, отказ в доступе будет неотличим от отсутствия
    карты.
  related_findings:
