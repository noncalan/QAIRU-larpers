  why: Ф-1 говорит о держателе карты, а API говорит о владельце. Для дополнительной карты это разные люди. От ответа зависит
    проверка принадлежности карты и тест доступа.
  where:
  - quote: Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно.
    place: строка 37
