    place: таблица 5, строка 3, ячейка 2, колонка «Значение»
  options:
  - label: A
    text: Только держатель, на чьё имя выпущена карта
    change: Определить «держатель карты» в глоссарии; в API проверять держателя; заменить «владелец» и «клиент» на «держатель»
    for_discussion: false
  - label: B
    text: Только владелец счёта, к которому выпущена карта
    change: Исправить Ф-1 на владельца счёта; держателю дополнительной карты скрыть настройку
    for_discussion: false
  - label: C
    text: И держатель, и владелец счёта
    change: Описать, чья настройка действует при сохранении обоими, и разрешить доступ обоим
    for_discussion: true
