  topic: push после смены порога
  question: 'Push о пороге 50 000 ₸ пришёл 10-го, 15-го клиент поднял порог до 80 000 ₸ при расходах 52 000 ₸, 20-го расходы
    достигли 80 000 ₸: приходит второй push?'
  why: Ф-3 ограничивает число push одним в месяц, а Ф-4 требует push после смены порога независимо от истории. От ответа зависит,
    сбрасывается ли признак отправки при сохранении порога.
  where:
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: строка 39
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: строка 40
  options:
  - label: A
    text: 'Да: смена порога сбрасывает признак отправки за текущий месяц'
    change: В Ф-3 добавить исключение для смены порога; при сохранении порога сбрасывать признак отправки
    for_discussion: false
  - label: B
    text: 'Нет: в календарном месяце не больше одного push при любых изменениях порога'
    change: Из Ф-4 убрать «независимо от истории предыдущей настройки»; признак отправки при смене порога не сбрасывать
    for_discussion: false
  if_unanswered: Команда оставит один push в месяц. Клиент, поднявший порог, не узнает о достижении нового порога до следующего
