  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: строка 163
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: строка 171
  options:
  - label: A
    text: 200 с result=ERROR и message; 400 — только при отсутствующем или нечисловом параметре
