  topic: месяц учёта покупки
  question: 'Покупку на 4 000 ₸ совершили 31 января в 23:58, а провели 1 февраля в 00:03 по Алматы: в расходы какого месяца
    она входит?'
  why: Ф-2 указывает на январь, критерий приёмки — на февраль, а цель «в момент покупки» расходится с учётом только проведённых
    покупок. От ответа зависят событие процессинга, на которое подписывается сервис, и дата, по которой выбирается счётчик
    месяца.
  where:
  - quote: Месяц определяется по дате совершения покупки в Алматы.
    place: строка 38
  - quote: Февральский счётчик вырос на 4 000 ₸
    place: таблица 2, строка 2, ячейка 3, колонка «Ожидаемый результат»
  - quote: Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.
    place: строка 23
  options:
  - label: A
    text: 'Январь: месяц по дате совершения, покупка учитывается после проведения'
    change: Исправить ожидаемый результат R-14 на январский счётчик; в цели заменить «в момент покупки» на «после проведения
      покупки»
    for_discussion: false
  - label: B
    text: 'Февраль: месяц по дате проведения покупки'
    change: В Ф-2 заменить «дату совершения» на «дату проведения»; в цели заменить «в момент покупки» на «после проведения
      покупки»
    for_discussion: false
  - label: C
    text: 'Январь: покупка учитывается уже при авторизации, месяц — по дате авторизации'
    change: Переписать Ф-2 на учёт авторизаций с уменьшением при отмене; исправить R-14 и событие в Sequence Diagram
    for_discussion: false
  if_unanswered: Команда возьмёт дату совершения и учёт после проведения, R-14 исправит на январь. Если бизнес ждал февраль
    или мгновенного push, тест приёмки и сроки уведомления разойдутся с ожиданиями.
