  question: 'Клиент сохраняет порог 999 ₸: какой код и какое тело ответа получает приложение?'
  why: Для отклонённой суммы описаны и 200 с ERROR, и 400; поле result есть только в ответах 200. От выбора зависят разбор
    ответа в приложении и проверки автотестов.
  where:
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: строка 163
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: строка 171
  - quote: '{"message":"Некорректный запрос"}'
    place: строка 180
  options:
  - label: A
    text: 200 с result=ERROR и message; 400 — только при отсутствующем или нечисловом параметре; в телах 400/401/404/500 только
      message
    change: Описать границу между 200/ERROR и 400; указать, что result есть только в ответе 200
    for_discussion: false
  - label: B
    text: 400 с телом из одного message; 200 возвращается только при result=OK
    change: Убрать пример ERROR из раздела 200; result в ответе 200 всегда OK
    for_discussion: false
  - label: C
    text: 400 с телом из result=ERROR и message; поле result есть во всех ответах
    change: Добавить result=ERROR в примеры 400, 401, 404 и 500
    for_discussion: false
