    place: строка 189
  options:
  - label: A
    text: 403 — функция для этой карты недоступна
    change: Добавить в логику метода проверку активности и валюты; описать 403 только для этого случая
    for_discussion: false
  - label: B
    text: 404, как для чужой и отсутствующей карты
    change: Добавить проверку с ответом 404; убрать 403 из перечня статусов
    for_discussion: false
  - label: C
    text: 'Ошибка параметров: 400 или ERROR по тем же правилам, что для неверной суммы'
    change: Добавить проверку с ответом ошибки параметров и своим текстом message; убрать 403
    for_discussion: true
  - label: D
    text: Метод сохраняет порог; ограничение Ф-1 выполняет только приложение
    change: Указать в Ф-1, что ограничение проверяется в интерфейсе; убрать 403
    for_discussion: false
  if_unanswered: Сервер сохранит порог для карты в USD или заблокированной карты, а статус 403 останется в документе без сценария.
