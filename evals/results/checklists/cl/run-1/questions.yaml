  topic: доступ к чужой карте
  question: 'Клиент с действующей сессией сохраняет порог для карты другого клиента: метод возвращает 403 или 404?'
  why: Для чужой карты описаны два разных кода. От выбора зависят закрытый перечень неуспешных кодов вместо «и далее», раскладка
    статусов по разделам и ожидаемый код теста доступа.
  where:
  - quote: Ответ в случае, если на указанный ресурс доступ запрещен.
    place: строка 175
  - quote: Для чужой карты возвращается 404, как и для отсутствующей карты.
    place: строка 189
  - quote: Если результат 400, 401 и далее — неуспешный.
    place: строка 151
  options:
  - label: A
    text: '404, как для отсутствующей карты: факт существования карты не раскрывается'
    change: 'Удалить 403; перечень неуспешных кодов: 400, 401, 404, 500'
    for_discussion: false
  - label: B
    text: 403 для чужой карты, 404 только для отсутствующей
    change: 'Разделить условия 403 и 404; перечень неуспешных кодов: 400, 401, 403, 404, 500'
    for_discussion: false
  if_unanswered: Команда вернёт 404. Если ИБ требует 403 для журналирования попыток доступа, такие попытки не отличить от
    опечаток.
