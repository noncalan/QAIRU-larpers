  topic: код ответа при ошибке
  question: 'Приложение отправляет порог 999 ₸ или признак включения 2: с каким кодом ответа метод отклоняет сохранение?'
  why: Пример ошибки суммы помещён под кодом 200, а неверные параметры описаны кодом 400. Ответ на недопустимый признак включения
    не задан вовсе. От этого зависят обработка в приложении, мониторинг и ожидаемый код негативных тестов.
  where:
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: строка 163
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: строка 171
  options:
  - label: A
    text: Любое недопустимое значение суммы или признака — 400 с result=ERROR и описанием ошибки
    change: Перенести пример ERROR под 400, добавить message для признака включения
    for_discussion: false
  - label: B
    text: Сумма вне диапазона — 200 с result=ERROR; неверный формат и недопустимый признак — 400
    change: В R-40.2 ограничить 400 ошибками формата; для 200 описать оба исхода, OK и ERROR
    for_discussion: false
  - label: C
    text: Любое недопустимое значение — 200 с result=ERROR; код 400 только для отсутствующих параметров
    change: Описать в R-24 отклонение признака включения по образцу отклонения суммы
    for_discussion: true
  if_unanswered: Команда вернёт 400 на любую ошибку значений. Приложение, рассчитанное на 200 с ERROR, не покажет сообщение
    под полем.
  related_findings:
  - F-07
  - F-29
  answer: null
  comment: null
