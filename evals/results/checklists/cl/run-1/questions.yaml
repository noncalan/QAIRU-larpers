  - quote: application/json
    place: строка 147
  - quote: Тело не используется.
    place: строка 148
  options:
  - label: A
    text: GET с параметрами в строке запроса, без тела и без Content-Type
    change: Удалить требование Content-Type из Request body; запретить кеширование ответа
    for_discussion: false
  - label: B
    text: 'PUT или POST с параметрами в теле JSON и обязательным Content-Type: application/json'
    change: Заменить REST type, перенести параметры из Query-параметров в Request body, обновить CURL
    for_discussion: false
  if_unanswered: Команда оставит GET, как в CURL. Повтор запроса прокси или предзагрузкой незаметно перезапишет настройку.
  related_findings:
