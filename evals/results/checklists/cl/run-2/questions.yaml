  topic: повторный push в месяце
  question: 'В марте push по порогу 50 000 ₸ уже пришёл, затем клиент меняет порог на 80 000 ₸ или выключает и включает уведомление:
    может ли прийти второй push в марте?'
  why: Ф-3 ограничивает push одним в месяц, а Ф-4 разрешает новый push после смены порога. О повторном включении не сказано
    ничего. От ответа зависят сброс признака отправки и ожидаемое число push в тесте.
  where:
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: строка 39
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: строка 40
  options:
  - label: A
    text: 'Нет: не больше одного push за месяц при любых изменениях настроек'
    change: Убрать из Ф-4 «независимо от истории предыдущей настройки»
    for_discussion: false
  - label: B
    text: Да, но только после сохранения другой суммы порога; выключение и включение признак не сбрасывают
    change: 'В Ф-3 добавить исключение: признак отправки сбрасывается при смене суммы порога'
    for_discussion: false
  - label: C
    text: Да, после любого сохранения настроек, включая выключение и повторное включение
    change: В Ф-3 и Ф-4 указать, что признак отправки сбрасывается при каждом сохранении настроек
    for_discussion: true
  if_unanswered: Команда сбросит признак только при смене суммы порога. Если ждали строгого лимита, клиент получит несколько
    push в месяц.
