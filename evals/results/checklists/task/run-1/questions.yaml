  topic: обязательный набор критериев
  question: 'Агент проверяет требования по собственному набору критериев, который не совпадает со свойствами ISO/IEC/IEEE
    29148:2018: такой агент соответствует ТЗ?'
  why: Формулировка «можно взять» и перечень с «и тому подобное» не задают закрытый набор свойств и видов дефектов. От этого
    зависят структура разделов проверки и проверка полноты отчёта.
  where:
  - quote: Критерии можно взять из ISO/IEC/IEEE 29148:2018 (п. 5.2.5 и 5.2.6) и IEEE Std 830-1998 (п. 4.3).
    place: строка 46
  - quote: 'Агент ищет дефекты формулировок: двусмысленность, непроверяемость, противоречия, пропуски, лишние проектные решения
      и тому подобное.'
    place: строка 17
  options:
  - label: A
    text: 'Нет: обязателен полный набор свойств 29148 п. 5.2.5 и 5.2.6'
    change: Заменить «можно взять» на «агент проверяет по»; в R-03.1, R-03.2 убрать «и тому подобное» и сослаться на стандарт
    for_discussion: false
  - label: B
    text: Да, если агент ищет как минимум виды дефектов, перечисленные в R-03.1, R-03.2
    change: Объявить перечень R-03.1, R-03.2 обязательным минимумом, а стандарты — рекомендацией
    for_discussion: false
  - label: C
    text: Да, набор критериев выбирает команда и перечисляет его в отчёте
    change: Добавить в состав отчёта список применённых критериев
    for_discussion: true
  if_unanswered: Команда возьмёт свойства 29148; если жюри ждёт другой набор, часть ожидаемых дефектов не будет искаться.
