  topic: уведомление выключено
  question: 'Уведомление выключено, порог 50 000 ₸; 10 марта расходы стали 52 000 ₸, 15 марта клиент включил уведомление:
    придёт ли push и сколько покажет счётчик?'
  why: Ф-3, BPMN и последовательность взаимодействий не учитывают переключатель. Неизвестно, считаются ли расходы при выключенном
    уведомлении и что происходит при включении выше порога. От этого зависят поток, данные и критерии приёмки, где переключатель
    тоже не указан.
  where:
  - quote: По умолчанию уведомление выключено.
    place: раздел «Требования к изменениям › Функциональные требования», строка 37
  - quote: Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push.
    place: раздел «Требования к изменениям › Функциональные требования», строка 39
  - quote: 'Сервис расходов → настройки: получить порог карты.'
    place: раздел «Часть A. Новый функционал › Sequence Diagram», строка 43
  options:
  - label: A
    text: Расходы считаются всегда; при включении выше порога push приходит сразу
    change: Добавить в Ф-3 условие включения и правило push при включении; дополнить BPMN и диаграмму чтением переключателя
    for_discussion: true
  - label: B
    text: Расходы считаются всегда; переход прошёл при выключенном уведомлении, поэтому push в марте не придёт
    change: 'Добавить в Ф-3: push только при включённом уведомлении в момент перехода; дополнить BPMN веткой «выключено»'
    for_discussion: false
  - label: C
    text: Пока уведомление выключено, расходы не учитываются; счёт начинается с момента включения
    change: В Ф-2 оговорить, что учёт идёт только при включённом уведомлении; счётчик на экране показывает расходы с момента
      включения
    for_discussion: true
  if_unanswered: Команда будет считать расходы всегда и не отправит push при включении; клиент, включивший уведомление после
