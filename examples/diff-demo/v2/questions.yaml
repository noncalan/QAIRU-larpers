  topic: выключенное уведомление
  question: 'Уведомление выключено, расходы за март 48 500 ₸, порог 50 000 ₸, проведена покупка на 1 500 ₸: что происходит
    с расходами, push и мартовским лимитом push?'
  why: 'В Ф-3 нет условия «уведомление включено». От ответа зависят правило отправки, учёт расходов и предусловия критериев
    приёмки: в R-14 и R-15 не заданы переключатель, отправлен ли уже push за месяц и порог.'
  where:
  - quote: По умолчанию уведомление выключено.
    place: раздел «Требования к изменениям › Функциональные требования», строка 39
  - quote: Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push.
    place: раздел «Требования к изменениям › Функциональные требования», строка 41
  options:
  - label: A
    text: Расходы учитываются, push не отправляется, лимит месяца не тратится
    change: Добавить в Ф-3 условие «уведомление включено»; в критерии приёмки — сценарий с выключенным уведомлением и предусловие
      «включено, push за месяц не было»
    for_discussion: true
  - label: B
    text: Расходы учитываются, push не отправляется, переход засчитывается как использованный лимит месяца
    change: 'Добавить в Ф-3 условие «уведомление включено» и правило: переход при выключенном уведомлении ставит признак отправки'
    for_discussion: true
  - label: C
    text: Пока уведомление выключено, расходы не учитываются и push не отправляется
    change: Указать в Ф-2, что учёт ведётся только при включённом уведомлении; на экране показывать сумму только с момента
      включения
    for_discussion: true
  - label: D
    text: Push отправляется независимо от переключателя
    change: Явно указать, что переключатель на отправку не влияет, и описать его назначение
    for_discussion: false
  if_unanswered: Команда будет учитывать расходы и не отправлять push без расхода лимита. Если бизнес ждал другого, придётся
    переделывать учёт и критерии приёмки.
