  topic: смена порога и лимит
  question: '5 марта при пороге 50 000 ₸ push уже ушёл, 10 марта клиент поднял порог до 80 000 ₸, 20 марта расходы выросли
    с 79 000 до 81 000 ₸: отправляется ли второй push?'
  why: Ф-3 и Ф-4 дают для этого сценария разные ожидаемые результаты. От ответа зависит, сбрасывает ли сохранение порога признак
    отправки за месяц.
  where:
  - quote: На карту приходится максимум один такой push за календарный месяц.
    place: раздел «Требования к изменениям › Функциональные требования», строка 41
  - quote: Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.
    place: раздел «Требования к изменениям › Функциональные требования», строка 42
  options:
  - label: A
    text: 'Да: сохранение нового порога сбрасывает лимит текущего месяца'
    change: В Ф-3 добавить исключение для смены порога; сохранение порога сбрасывает признак отправки за текущий месяц
    for_discussion: false
  - label: B
    text: 'Нет: в месяце не больше одного push, смена порога лимит не сбрасывает'
    change: Убрать из Ф-4 слова «независимо от истории предыдущей настройки» и уточнить, что следующий push возможен в следующем
      месяце
    for_discussion: false
  - label: C
    text: Лимит сбрасывается только при повышении порога, при снижении сохраняется
    change: Описать в Ф-4 правило для повышения и для снижения порога
    for_discussion: true
  if_unanswered: Команда оставит один push в месяц. Клиент, поднявший порог, не узнает о достижении нового бюджета.
  related_findings:
  - F-02
  answer: null
  comment: null
