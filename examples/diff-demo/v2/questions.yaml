  topic: отказ сервиса push
  question: 'Покупка довела расходы до порога, а сервис push вернул ошибку: что происходит с учётом покупки, признаком отправки
    и повтором передачи?'
  why: Ни на схеме процесса, ни на диаграмме нет веток отказа. Ещё не заданы таймаут и число повторов, поведение при недоступности
    сервиса настроек, состав его ответа (есть ли признак включения) и шаблон текста push.
  where:
  - quote: 'Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога.'
    place: раздел «Часть A. Новый функционал › Sequence Diagram», строка 45
  - quote: Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение.
    place: раздел «Требования к изменениям › BPMN схема процесса», строка 36
  options:
  - label: A
    text: Покупка учтена, признак не ставится, передача повторяется N раз, после исчерпания push теряется
    change: Добавить ветку отказа на схему и диаграмму, задать N, интервал и запись в журнал
    for_discussion: true
  - label: B
    text: Покупка учтена, признак ставится сразу, повторов нет
    change: Указать, что признак ставится при попытке передачи и неудача не повторяется
    for_discussion: true
  - label: C
    text: Событие не подтверждается, процессинг доставляет его повторно и обработка начинается заново
    change: Описать подтверждение события только после успешной передачи push и связь с правилом повторной доставки
    for_discussion: true
  if_unanswered: Команда учтёт покупку и будет повторять передачу без признака. Без согласованных N и интервала push может
    уйти с опозданием или потеряться без следа.
  related_findings:
