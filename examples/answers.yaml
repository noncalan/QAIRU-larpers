  topic: ответ на неверные параметры
  question: 'Владелец сохраняет порог 999 ₸ или передаёт enabled=2: какой HTTP-код и тело возвращает метод?'
  why: Описание статусов даёт 400, а пример под заголовком 200 даёт result=ERROR. От выбора зависят обработка в приложении,
    мониторинг и негативные тесты; отдельно нужно решить, есть ли в теле ошибки прежние amount и enabled.
  where:
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: строка 163
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: строка 171
  - quote: При отклонении суммы вернуть прежнее состояние и результат ERROR.
    place: строка 121
  options:
  - label: A
    text: 400 с телом {"message":"Некорректный запрос"} для любой ошибки параметров
    change: Удалить пример 200 с result=ERROR; в R-24 заменить «результат ERROR» на 400
    for_discussion: false
  - label: B
    text: 200 с result=ERROR и текстом конкретной ошибки
    change: Сузить 400 до синтаксических ошибок; задать тексты message для каждой ошибки проверки
    for_discussion: false
  - label: C
    text: 400 с телом {"result":"ERROR","message":…} и текстом конкретной ошибки
    change: Перенести пример ERROR в раздел 400; задать тексты message
    for_discussion: true
  if_unanswered: Команда вернёт 200 с ERROR по примеру; мониторинг будет считать отклонённые сохранения успешными.
  related_findings:
  - F-26
  - F-27
  - F-30
  answer: A
  comment: Любая ошибка проверки параметров даёт 400
