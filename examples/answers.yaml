    change: Добавить проверку статуса и валюты карты в логику валидации, удалить 403, закрыть перечень кодов
    for_discussion: true
  if_unanswered: Метод сохранит порог для заблокированной или валютной карты вопреки Ф-1, а код 403 останется без условия.
