  topic: ответ на недопустимую сумму
  question: 'Клиент сохраняет порог 999 ₸ для своей карты: какой код и какое тело возвращает метод сохранения?'
  why: Описание статуса 400, пример под статусом 200 и логика метода дают три разных ответа. От выбора зависят обработка ответа
    в приложении, мониторинг ошибок и негативные тесты. Тот же ответ нужен для недопустимого enabled (2, пусто).
  where:
  - quote: Ответ в случае, если параметры запроса заполнены неверно.
    place: строка 163
  - quote: '{"result":"ERROR","message":"Проверьте сумму"}'
    place: строка 171
  - quote: При отклонении суммы вернуть прежнее состояние и результат ERROR.
    place: строка 121
  options:
  - label: A
    text: Код 400, тело {"message":"Некорректный запрос"}
    change: Убрать пример ERROR из раздела 200; пункт логики о результате ERROR заменить ответом 400
    for_discussion: false
  - label: B
    text: Код 200, тело {"result":"ERROR","message":"Проверьте сумму"}
    change: Статус 400 оставить только для отсутствующих и нечисловых параметров
    for_discussion: false
  - label: C
    text: Код 200, тело с result=ERROR, сообщением и прежними amount и enabled
    change: Добавить пример ответа ERROR с прежними значениями amount и enabled
    for_discussion: false
  - label: D
    text: Код 400, тело {"result":"ERROR","message":"Проверьте сумму"}
    change: Перенести пример ERROR в раздел 400 и развести тела ответов для неверной суммы и для неверного формата
    for_discussion: true
  if_unanswered: 'Приложение и сервис реализуют разные коды: ошибка с кодом 200 будет считаться мониторингом успехом, а негативные
    тесты не получат одного ожидаемого результата.'
  related_findings:
  - F-08
  - F-34
  - F-35
  answer: A
  comment: null
