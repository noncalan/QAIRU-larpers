  topic: порог уже превышен
  question: 'Расходы марта 60 000 ₸, клиент включает уведомление или снижает порог до 50 000 ₸, затем проходит покупка на
    1 000 ₸: когда клиент получает push?'
  why: BPMN проверяет «≥ порога», Ф-3 — переход через порог, а случай, когда настройка ставит порог ниже накопленной суммы,
    не описан. Не сказано и то, учитываются ли расходы при выключенном уведомлении.
  where:
  - quote: Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение.
    place: строка 34
  - quote: Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push.
    place: строка 39
  - quote: По умолчанию уведомление выключено.
    place: строка 37
  options:
  - label: A
    text: Сразу после сохранения настройки
    change: В Ф-4 добавить проверку суммы при сохранении настройки и отправку push
    for_discussion: true
  - label: B
    text: При следующей покупке, раз расходы не ниже порога и push в месяце не было
    change: В Ф-3 заменить проверку перехода на условие «расходы ≥ порога и push в месяце не отправлялся»
    for_discussion: false
  - label: C
    text: 'В этом месяце push не приходит: перехода снизу вверх не было'
    change: В Ф-4 явно записать, что push возможен только в следующем месяце; привести BPMN к формулировке Ф-3
    for_discussion: false
  if_unanswered: Команда реализует проверку перехода по Ф-3. Клиент, включивший уведомление при уже превышенном бюджете, не
    получит push до следующего месяца.
  related_findings:
  - F-02
  - F-14
  - F-25
  answer: B
  comment: null
