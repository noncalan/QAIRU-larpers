  topic: момент учёта покупки
  question: 'Порог 50 000 ₸, расходы 48 500 ₸; покупку на 1 500 ₸ одобрили 10 марта, а процессинг провёл 12 марта: в какой
    день клиент получает push?'
  why: Цель обещает push «в момент покупки», а Ф-2 учитывает только проведённые покупки. От ответа зависят событие процессинга,
    на которое реагирует сервис, и учёт отменённых авторизаций. Дата, по которой выбирается месяц, решается в вопросе о месяце.
  where:
  - quote: Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.
    place: строка 23
  - quote: В расходы входят проведённые покупки.
    place: строка 38
  options:
  - label: A
    text: '10 марта: покупка учитывается при авторизации, отмена авторизации уменьшает расходы'
    change: 'Переписать Ф-2: в расходы входят одобренные авторизации; добавить правило для отменённой авторизации'
    for_discussion: false
  - label: B
    text: '12 марта: покупка учитывается только после проведения'
    change: 'Переписать цель: push после проведения покупки; указать, какое событие процессинга считается проведением'
    for_discussion: false
  if_unanswered: 'Команда будет учитывать только проведение: push придёт клиенту через дни после покупки, и цель не будет
    достигнута.'
  related_findings:
  - F-02
  - F-09
  answer: A
  comment: null
