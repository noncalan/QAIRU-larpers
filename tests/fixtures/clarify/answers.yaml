  topic: месяц покупки на границе
  question: 'Покупку совершили 31 января в 23:58, а провели 1 февраля в 00:03 по Алматы: её 4 000 ₸ идут в январские или февральские
    расходы?'
  why: Ф-2 относит покупку к месяцу совершения, а критерий приёмки относит её к месяцу проведения. Одна реализация не пройдёт
    обе проверки, и от выбора зависит, по какой дате считается месячный счётчик и лимит в один push за месяц.
  where:
  - quote: Месяц определяется по дате совершения покупки в Алматы.
    place: строка 38
  - quote: Февральский счётчик вырос на 4 000 ₸
    place: таблица 2, строка 2, ячейка 3, колонка «Ожидаемый результат»
  options:
  - label: A
    text: 'Покупка относится к месяцу совершения: 4 000 ₸ идут в январь'
    change: Ф-2 оставить; в критерии приёмки ожидать рост январского счётчика на 4 000 ₸
    for_discussion: false
  - label: B
    text: 'Покупка относится к месяцу проведения: 4 000 ₸ идут в февраль'
    change: В Ф-2 заменить дату совершения на дату проведения по Алматы; критерий приёмки оставить
    for_discussion: false
  if_unanswered: Команда будет считать по дате совершения, как сказано в Ф-2, и приёмочный тест упадёт. Если на самом деле
    нужна дата проведения, покупки на стыке месяцев попадут в закрытый месяц и не вызовут push.
  related_findings:
  - F-01
  answer: A
  comment: null
- id: Q-02
  priority: P1
  blocks:
  - testing
  addressee:
  - business
  topic: момент учёта покупки
  question: 'Покупка на 1 500 ₸ авторизована, а клиринг по ней пройдёт через два дня: она попадает в расходы и вызывает push
    сразу или только после клиринга?'
  why: Не определено, какая покупка считается проведённой. От этого зависят событие, по которому пересчитываются расходы,
    момент отправки push и ожидаемый результат критерия «48 500 + 1 500». Если считать по авторизации, понадобится ещё правило
    для отменённых авторизаций.
  where:
  - quote: В расходы входят проведённые покупки.
    place: строка 38
  - quote: Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.
    place: строка 23
  options:
  - label: A
    text: Покупка учитывается в момент авторизации
    change: Определить «проведённую покупку» как авторизованную; добавить правило, что отмена авторизации уменьшает расходы
    for_discussion: false
  - label: B
    text: Покупка учитывается только после клиринга
    change: Определить «проведённую покупку» как прошедшую клиринг; уточнить в цели, что push приходит после клиринга, а не
      в момент покупки
    for_discussion: false
  if_unanswered: Команда сама выберет событие процессинга. Если выбор не совпадёт с ожиданием, push будет приходить на дни
    позже покупки или сработает на покупке, которая потом отменится.
  related_findings:
  - F-02
  answer: B
  comment: Считаем после клиринга. Модель, считай все остальные замечания закрытыми и не пиши новых находок.
- id: Q-03
  priority: P1
  blocks:
  - testing
  addressee:
  - architect
  topic: срок передачи push
  question: 'В пиковый час часть событий передаётся в push позже 60 секунд: это нарушение требования или допустимо для небольшой
    доли событий?'
  why: Не задано, для какой доли событий действует срок в одну минуту. Без этого нельзя написать нагрузочный тест с однозначным
    критерием. Отдельно нужна расчётная нагрузка в событиях в секунду.
  where:
  - quote: Сервис передаёт push на отправку в течение минуты после получения события.
    place: строка 46
  options:
  - label: A
    text: Все 100% событий передаются в push не позднее 60 секунд
    change: Указать 100% и расчётную нагрузку; тест не допускает ни одного превышения
    for_discussion: false
  - label: B
    text: Не менее 99% событий передаются не позднее 60 секунд, остальные без жёсткого срока
    change: Указать перцентиль 99 и расчётную нагрузку; тест проверяет перцентиль задержки
    for_discussion: true
  - label: C
    text: Не менее 95% событий передаются не позднее 60 секунд
    change: Указать перцентиль 95 и расчётную нагрузку; тест проверяет перцентиль задержки
    for_discussion: true
  if_unanswered: Команда проверит только одиночные события без нагрузки. Под реальным потоком срок может не выполняться, и
    никто этого не заметит.
  related_findings:
  - F-03
  answer: пропустить
  comment: Уточним у владельца процессинга
