units:
  # ---------- Часть A ----------
  - {gid: G01, label: req, type: goal, source_id: null, section: "A / Цели",
     quote: "Дать клиенту возможность узнать о достижении личного бюджета в момент покупки."}
  - {gid: G02, label: optional, type: architecture, source_id: null, section: "A / Архитектура решения",
     quote: "Мобильное приложение → сервис настроек. Карточный процессинг → учёт расходов → сервис push.",
     atoms: ["Мобильное приложение → сервис настроек.", "Карточный процессинг → учёт расходов → сервис push."]}
  - {gid: G03, label: optional, type: scope, source_id: null, section: "A / Общие сведения",
     quote: "Мобильный банк, карточный процессинг, сервис уведомлений"}
  - gid: G04
    label: req
    type: ui
    source_id: null
    section: "A / Дизайн процесса UI"
    quote: "Карты → Расходы → Уведомления. На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить». При ошибке ввода сообщение появляется под полем."
    atoms:
      - "Карты → Расходы → Уведомления."
      - "На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить»."
      - "При ошибке ввода сообщение появляется под полем."
  - {gid: G05, label: req, type: process, source_id: null, section: "A / BPMN схема процесса",
     quote: "Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение."}
  - gid: G06
    label: req
    type: functional
    source_id: "Ф-1"
    section: "A / Функциональные требования"
    quote: "Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно. По умолчанию уведомление выключено."
    atoms:
      - "Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно."
      - "По умолчанию уведомление выключено."
  - gid: G07
    label: req
    type: functional
    source_id: "Ф-2"
    section: "A / Функциональные требования"
    quote: "Месяц определяется по дате совершения покупки в Алматы. В расходы входят проведённые покупки. Возврат уменьшает расходы месяца исходной покупки. Переводы и снятие наличных исключаются."
    atoms:
      - "Месяц определяется по дате совершения покупки в Алматы."
      - "В расходы входят проведённые покупки."
      - "Возврат уменьшает расходы месяца исходной покупки."
      - "Переводы и снятие наличных исключаются."
  - gid: G08
    label: req
    type: functional
    source_id: "Ф-3"
    section: "A / Функциональные требования"
    quote: "Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push. На карту приходится максимум один такой push за календарный месяц."
    atoms:
      - "Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push."
      - "На карту приходится максимум один такой push за календарный месяц."
  - gid: G09
    label: req
    type: functional
    source_id: "Ф-4"
    section: "A / Функциональные требования"
    quote: "При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки."
    atoms:
      - "При изменении порога накопленная сумма сохраняется."
      - "Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки."
  - gid: G10
    label: req
    type: interaction
    source_id: null
    section: "A / Sequence Diagram"
    quote: "Процессинг → сервис расходов: проведена покупка. Сервис расходов → настройки: получить порог карты. Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога."
    atoms:
      - "Процессинг → сервис расходов: проведена покупка."
      - "Сервис расходов → настройки: получить порог карты."
      - "Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога."
  - {gid: G11, label: req, type: nfr, source_id: null, section: "A / Нефункциональные требования",
