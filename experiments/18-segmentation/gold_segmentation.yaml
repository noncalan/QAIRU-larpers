# Эталонная нарезка data/input/requirements.md (тема 18).
# ТОЛЬКО ДЛЯ EVAL. Не класть в промпты, few-shot и правила агента (CLAUDE.md, правило 2; D-003).
# Составитель: Claude (субагент researcher), 25.11.2026. Один разметчик, без перекрёстной проверки.
#
# Уровни:
#   unit  — структурная единица документа (пункт списка, строка таблицы, абзац раздела, код статуса).
#   atoms — единичные (singular) утверждения внутри unit; если atoms нет, unit сам атомарен.
# label: req      — агент обязан выделить (входит в знаменатель recall);
#        optional — можно выделить или пропустить (не входит ни в recall, ни в ложные).
# Всё, что не покрыто цитатами req/optional (заголовки, паспорт, чек-лист ревью, согласующие,
# «заполняются тестировщиками», метаданные части B), считается НЕ требованием.
# quote — дословная цитата (eval нормализует разметку, пробелы, регистр); also — доп. места того же требования.
schema_version: 1
gold_version: "seg-2026-11-25.1"
