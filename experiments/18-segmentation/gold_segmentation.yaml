  - {gid: G16, label: req, type: acceptance, source_id: null, section: "A / Критерии приемки, строка 3",
     quote: "Расходы 19 900 ₸, порог 20 000 ₸ | Перевести 500 ₸ | Счётчик показывает 19 900 ₸"}

