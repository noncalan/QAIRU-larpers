  - gid: G13
    label: req
    type: integration
    source_id: null
    section: "A / Требования к интеграции"
    quote: "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API». Повторная доставка одного события процессинга сохраняет исходный итог."
    atoms:
      - "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API»."
      - "Повторная доставка одного события процессинга сохраняет исходный итог."
  - {gid: G14, label: req, type: acceptance, source_id: null, section: "A / Критерии приемки, строка 1",
