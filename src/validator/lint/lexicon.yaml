# Словари линтера (шаг 3). Общие для любых ТЗ на русском и английском: слов проверяемого документа
# здесь быть не должно (CLAUDE.md, правила 2 и 3; это проверяет tests/test_prompt_leak.py).
#
# Запись описывает одно слово или оборот и ровно одним из ключей:
#   stem:    начало слова, дальше любые окончания («удобн» найдёт «удобный», «удобно», «удобства»);
#   word:    слово целиком, без других окончаний;
#   phrase:  оборот целиком; пробел значит «один или несколько пробелов», «. » значит «точка и, может быть,
#            пробел» («и т. д.» найдёт и «и т.д.»);
#   pattern: регулярное выражение для случаев, где нужны точные окончания (границы слова ставит код).
# Поле `why` объясняет, почему слово размыто или что оно скрывает. Его читает человек в отчёте:
# текст попадает в объяснение находки. Регистр и «ё» не важны. Слова внутри кавычек «…», "…" и кода `…`
# не ищем: это названия и метки интерфейса, а не формулировка требования (кроме раздела `markers`).
#
# Список короткий нарочно: у пробного прогона 150 срабатываний на 198 строк почти все были шумом
# (исследование 01, п. 3.1). Сюда попали только слова, которые почти всегда дефект в тексте требования.
# Известные ложные срабатывания (термин с определением, число рядом) снимает код, не словарь.

# L-01. Размытые слова: оценка зависит от читателя, проверку по ним не написать.
vague_terms:
  # Субъективные оценки
  - stem: удобн
    why: «удобно» для каждого своё, измерить это нельзя
  - stem: интуитивн
    why: «интуитивно понятно» проверяется только мнением, критерия нет
  - stem: понятн
    why: «понятно» зависит от читателя, критерий понятности не назван
  - stem: дружелюбн
    why: «дружелюбный интерфейс» — оценка вкуса, а не свойство системы
  - stem: красив
    why: красота — оценка вкуса, тест по ней не написать
  - stem: привлекательн
    why: привлекательность — оценка вкуса, тест по ней не написать
  - stem: приятн
    why: «приятно» — оценка вкуса, тест по ней не написать
  - stem: легк
    why: «легко» для каждого своё, число или сценарий не названы
  - stem: надежн
    why: надёжность без числа (доступность, время простоя) нельзя проверить
  - stem: эффективн
    why: эффективность без метрики нельзя проверить, непонятно, по какому показателю судить
  - stem: современн
    why: «современный» устаревает и не задаёт ни версии, ни свойства
  - stem: гибк
    why: гибкость без перечня того, что должно настраиваться, не проверяется
  - stem: масштабируем
    why: масштабируемость без целевой нагрузки и границ не проверяется
  - stem: приемлем
    why: «приемлемо» для кого и по какому критерию, не сказано
  - stem: адекватн
    why: «адекватно» не задаёт меры
  - stem: разумн
    why: «разумный» зависит от мнения, критерия нет
  - stem: оптимальн
    why: «оптимальный» по какому критерию, не сказано
  - stem: качественн
    why: качество без метрики нельзя проверить
  - stem: высокопроизводительн
    why: производительность без нагрузки и времени отклика не проверяется
  - phrase: высокая производительность
    why: производительность без нагрузки и времени отклика не проверяется
  - phrase: высокая скорость
    why: скорость без числа и единицы нельзя проверить
  - phrase: высокая надёжность
    why: надёжность без числа (доступность, время простоя) нельзя проверить
  - phrase: высокое качество
    why: качество без метрики нельзя проверить
  # Размытая величина
  - stem: быстр
    why: «быстро» без числа и единицы времени не проверить, у каждого своя скорость
  - stem: оперативн
    why: «оперативно» не задаёт срок
  - stem: своевременн
    why: «своевременно» не задаёт срок
  - phrase: как можно
    why: «как можно быстрее, больше, меньше» не имеет границы, тест нечем остановить
  - stem: максимально
    why: «максимально» без предела не проверяется
  - stem: значительн
    why: «значительно» не задаёт величину
  - stem: существенн
    why: «существенно» не задаёт величину
  - stem: небольш
    why: «небольшой» не задаёт величину
  - pattern: достаточн(?:ый|ая|ое|ые|ого|ому|ым|ых|ую|ой|ом|ыми)
    why: «достаточный» без критерия достаточности не проверяется
  - word: несколько
    why: «несколько» не называет число, тест не знает, сколько ожидать
  - stem: некотор
    why: «некоторые» не называет, какие именно и сколько
  - word: множество
    why: «множество» не называет число
  - stem: примерно
    why: «примерно» без допуска (±) не проверяется
  - stem: приблизительно
    why: «приблизительно» без допуска (±) не проверяется
  - word: почти
    why: «почти» без допуска не проверяется
  - word: практически
    why: «практически» не отличает выполнение от невыполнения
  # Время без меры
  - stem: мгновенн
    why: «мгновенно» физически недостижимо, допустимое время (например, 95-й процентиль) не названо
  - stem: моментальн
    why: «моментально» не задаёт допустимое время
  - stem: немедленн
    why: «немедленно» не задаёт допустимое время
  - word: сразу
    why: «сразу» не задаёт допустимое время между событиями
  - phrase: в реальном времени
    why: «в реальном времени» не задаёт допустимую задержку
  - phrase: в режиме реального времени
    why: «в режиме реального времени» не задаёт допустимую задержку
  - phrase: без задержек
    why: «без задержек» не задаёт допустимую задержку
  - phrase: без задержки
    why: «без задержки» не задаёт допустимую задержку
  # Английский
  - word: fast
    why: «fast» без числа и единицы нельзя проверить
  - word: quick
    why: «quick» без числа и единицы нельзя проверить
  - word: quickly
    why: «quickly» без числа и единицы нельзя проверить
  - word: easy
    why: «easy» субъективно, критерия для проверки нет
  - word: easily
    why: «easily» субъективно, критерия для проверки нет
  - phrase: user-friendly
    why: «user-friendly» — вопрос вкуса, критерия для проверки нет
  - phrase: user friendly
    why: «user friendly» — вопрос вкуса, критерия для проверки нет
  - word: intuitive
    why: «intuitive» субъективно, критерия для проверки нет
  - word: efficient
    why: «efficient» без метрики нельзя проверить
  - word: efficiently
    why: «efficiently» без метрики нельзя проверить
  - word: flexible
    why: «flexible» без перечня того, что настраивается, не проверяется
  - word: robust
    why: «robust» без сценариев отказа не проверяется
  - word: reliable
    why: «reliable» без числа (доступность, доля отказов) не проверяется
  - word: modern
    why: «modern» устаревает и не задаёт ни версии, ни свойства
  - word: adequate
    why: «adequate» не задаёт критерия
  - word: reasonable
    why: «reasonable» — мнение, критерия нет
  - word: sufficient
    why: «sufficient» не задаёт критерия достаточности
  - word: significant
    why: «significant» не задаёт величину
  - word: seamless
    why: «seamless» субъективно, критерия для проверки нет
  - word: scalable
    why: «scalable» без целевой нагрузки не проверяется
  - word: instantly
    why: «instantly» не задаёт допустимое время
  - word: immediately
    why: «immediately» не задаёт допустимое время
  - word: several
    why: «several» не называет число
  - phrase: real-time
    why: «real-time» не задаёт допустимую задержку
  - phrase: real time
    why: «real time» не задаёт допустимую задержку
  - phrase: as soon as possible
    why: «as soon as possible» не задаёт срок

# L-02. Лазейки: условие или обязательность оставлены на усмотрение исполнителя.
loopholes:
  - phrase: при необходимости
    why: не сказано, кто и по какому признаку решает, что необходимость есть
  - phrase: в случае необходимости
