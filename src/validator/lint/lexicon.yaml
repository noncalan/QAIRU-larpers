# L-03. Открытые перечни: список обрывается словом «и так далее», разработчик не знает, что ещё делать.
open_lists:
  - phrase: и т. д.
    why: перечень не закончен, остальные элементы не названы
  - phrase: и т. п.
    why: перечень не закончен, остальные элементы не названы
  - phrase: и тому подобное
    why: перечень не закончен, остальные элементы не названы
  - phrase: и тому подобные
    why: перечень не закончен, остальные элементы не названы
  - phrase: и так далее
    why: перечень не закончен, остальные элементы не названы
  - phrase: и прочее
    why: перечень не закончен, остальные элементы не названы
  - phrase: и прочие
    why: перечень не закончен, остальные элементы не названы
  - phrase: и др.
    why: перечень не закончен, остальные элементы не названы
  - phrase: и пр.
    why: перечень не закончен, остальные элементы не названы
  - pattern: \d+(?:\s*[,;]\s*\d+)*\s*,?\s+и\s+далее
    why: ряд значений обрывается словами «и далее», верхняя граница не названа
  - pattern: не\s+ограничива\w+
    why: «не ограничиваясь» прямо говорит, что перечень открыт
  - phrase: etc.
    why: перечень не закончен, остальные элементы не названы
  - phrase: and so on
    why: перечень не закончен, остальные элементы не названы
  - phrase: and so forth
    why: перечень не закончен, остальные элементы не названы
  - phrase: and the like
    why: перечень не закончен, остальные элементы не названы
  - phrase: not limited to
    why: «not limited to» прямо говорит, что перечень открыт

# L-04. «И/или»: нельзя понять, нужны оба варианта или любой один.
and_or:
  - pattern: и\s*/\s*или
    why: «и/или» допускает три разных чтения (первое, второе, оба), для каждого свой тест
  - pattern: and\s*/\s*or
    why: «and/or» допускает три чтения (первое, второе, оба), для каждого свой тест

# L-05. Маркеры незавершённости: требование прямо сказано, что оно не дописано.
# Здесь ищем и в кавычках: «TBD» в кавычках остаётся «TBD».
markers:
  - word: tbd
    why: «TBD» прямо говорит, что значение не определено
  - word: tbc
    why: «TBC» прямо говорит, что значение не подтверждено
  - word: tbr
    why: «TBR» прямо говорит, что значение не подтверждено
  - word: tbs
    why: «TBS» прямо говорит, что значение не определено
  - word: todo
    why: «TODO» — пометка автора о недописанном
  - word: fixme
    why: «FIXME» — пометка автора о недописанном
  - word: xxx
    why: «XXX» — пометка автора о недописанном
  - pattern: \?{3,}
    why: «???» — пометка автора, что здесь вопрос без ответа
  - pattern: уточня(?:ет|ют)ся
    why: «уточняется» — значение ещё не известно, а тест по нему не написать
  - pattern: (?:будет|будут)\s+уточнен\w*
    why: «будет уточнено» — значение ещё не известно
  - pattern: (?:будет|будут)\s+определен\w*
    why: «будет определено» — значение ещё не известно
  - pattern: (?:будет|будут)\s+определя\w+
    why: «будет определяться» — значение ещё не известно
  - pattern: подлежит\s+уточнению|подлежат\s+уточнению
    why: «подлежит уточнению» — значение ещё не известно
  - pattern: to\s+be\s+(?:defined|determined|confirmed|decided|specified|agreed|announced)
    why: «to be defined» — значение ещё не известно
  - pattern: \[\s*(?:указать|уточнить|заполнить|вставить|добавить|описать)\b[^\]]*\]
    why: незаполненная заготовка в квадратных скобках осталась в тексте
