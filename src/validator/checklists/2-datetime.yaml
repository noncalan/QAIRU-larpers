# Доменный чек-лист: даты, время и периоды. Общие знания, без слов проверяемого документа
# (CLAUDE.md, правила 2 и 3). Формат файла и правила триггеров: README.md в этой папке.
id: DT
title: Даты, время и периоды
triggers:
  min_blocks: 2
  patterns:
    - '\bдат[аыуеой]\b'
    - '\bвремен'
    - '\bчас(?:а|ов|ы)?\b'
    - '\bминут'
    - '\bсекунд'
    - '\bсут(?:ки|ок|ках)\b'
    - '\bнедел'
    - '\bмесяц'
    - '\bкварта'
    - '\bпериод'
    - '\bсрок'
    - '\bежедневн|\bеженедельн|\bежемесячн'
    - '\bкалендарн'
    - '(?-i:\b(?:UTC|GMT)\b)'
    - '\bчасов(?:ой|ого|ом) пояс'
    - '\b(?:timestamp|datetime|timezone|date|time)\b'
    - '\bрасписани'
items:
  - id: DT-01
    property: IND-UNAMB
    question: >-
      Для каждого момента времени сказано, в каком часовом поясе он задан и считается (пояс пользователя,
      сервера, UTC), и пояс указан смещением от UTC или идентификатором IANA, а не только названием места?
    why: >-
      Одно и то же событие попадёт в разные сутки у разработчика и тестировщика.
  - id: DT-02
    property: IND-UNAMB
    question: >-
      Границы периодов заданы точно: входят ли начало и конец, с какого и по какой момент считается
      день, неделя или месяц, календарный это период или скользящее окно?
    why: >-
      У теста на событие на границе периода нет одного ожидаемого результата.
  - id: DT-03
    property: IND-COMPL
    question: >-
      По какому моменту событие относится к периоду (создание, подтверждение, завершение, получение
      системой), и что происходит с событием, которое началось в одном периоде, а завершилось в другом?
    why: >-
      Событие на стыке периодов будет учтено в разных периодах в зависимости от выбранного момента.
  - id: DT-04
    property: IND-VERIF
    question: >-
      Сроки и длительности измеримы: есть единица, точка начала и конца отсчёта («в течение N минут» от
      чего и до чего), сказано, рабочие или календарные дни и что с выходными и праздниками?
    why: >-
      Без точки отсчёта и единицы срок нельзя проверить тестом.
  - id: DT-05
    property: SET-CONS
    question: >-
      Формат даты и времени одинаков в тексте, примерах и интерфейсах: порядок полей, точность (до минут,
      секунд, миллисекунд), наличие смещения часового пояса?
    why: >-
      Разные форматы ломают обмен между системами и сравнение ожидаемого результата в тесте.
  - id: DT-06
    property: SET-COMPL
    question: >-
      Если результат зависит от календаря: описаны ли конец месяца с разным числом дней, 29 февраля,
      переход года и перевод часов там, где он есть?
    why: >-
      Это типичные граничные случаи тест-дизайна; без правила для них ожидаемый результат не выводится.
