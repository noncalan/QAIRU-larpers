# Доменный чек-лист: статусы и жизненный цикл объектов. Общие знания тест-дизайна (переходы
# состояний), без слов проверяемого документа (CLAUDE.md, правила 2 и 3). Формат: README.md в этой папке.
id: LC
title: Статусы и жизненный цикл
triggers:
  min_blocks: 2
  patterns:
    - '\bстатус'
    - '\bсостояни[еяию]'
    - '\bжизненн(?:ый|ого|ом) цикл'
    - '\bперех(?:од|одит|одят|ода) в\b'
    - '\bблокировк|\bзаблокирова|\bразблокир'
    - '\bотмен(?:а|ы|у|ой|ить|ён|ен)'
    - '\bвозврат'
    - '\bпровед[её]н|\bпроводк'
    - '\bподтвержд[её]н'
    - '\bчерновик'
    - '\bархивир'
    - '\b(?:status|state|lifecycle)\b'
items:
  - id: LC-01
    property: SET-COMPL
    question: >-
      Перечислены все статусы объекта и допустимые переходы между ними с событием или действием, которое
      вызывает переход; нет статуса без выхода и перехода без условия?
    why: >-
      Тесты переходов состояний строятся по этой таблице; без неё переходы покрыть нельзя.
  - id: LC-02
    property: IND-COMPL
    question: >-
      Описано, что происходит при недопустимом переходе или действии в неподходящем статусе (повторная
      отмена, изменение завершённого объекта, действие над удалённым)?
    why: >-
      Негативный тест на недопустимый переход без этого не имеет ожидаемого результата.
  - id: LC-03
    property: IND-UNAMB
    question: >-
      Для каждого статуса понятно, учитывается ли объект в расчётах, отчётах, ограничениях и сообщениях
      (промежуточные, отменённые, частично завершённые объекты)?
    why: >-
      Объект в промежуточном статусе разработчик учтёт, а тестировщик нет, или наоборот.
  - id: LC-04
    property: SET-COMPL
    question: >-
      Описаны обратные и корректирующие операции (отмена, возврат, исправление) и их влияние на уже
      выполненные действия, посчитанные значения и отправленные сообщения?
    why: >-
      Сценарий отмены после выполненного действия без правила не имеет ожидаемого результата.
  - id: LC-05
    property: SET-COMPL
    question: >-
      Определён результат одновременных действий над одним объектом (два запроса подряд, событие во время
      изменения настроек или статуса)?
    why: >-
      Без правила результат зависит от гонки, и тест на одновременность нестабилен.
