# Доменный чек-лист: персональные данные и безопасность. Общие знания, без слов проверяемого документа
# (CLAUDE.md, правила 2 и 3). Формат файла и правила триггеров: README.md в этой папке.
id: PD
title: Персональные данные и безопасность
triggers:
  min_blocks: 2
  patterns:
    - '\bперсональн'
    - '(?-i:\bПДн\b)'
    - '\bличн(?:ые|ых|ым) данн'
    - '(?-i:\b(?:ИИН|ИНН|СНИЛС|БИН)\b)'
    - '\bпаспортн'
    - '\bтелефон'
    - '\be-?mail\b|\bэлектронн(?:ая|ой|ую) почт'
    - '\bномер(?:а|ом)? карт'
    - '(?-i:\b(?:PAN|CVV|CVC|PIN|OTP)\b)'
    - '\bпарол'
    - '\bаутентифик'
    - '\bтокен'
    - '\bшифрован'
    - '\bмаскир'
    - '\bсоглас(?:ие|ия|ии) (?:на|клиента|пользователя)'
    - '\bжурнал(?:е|ы|ах)? (?:событий|действий|аудита|доступа)'
    - '\bправ(?:а|ам) доступа'
    - '\bрол(?:ь|и|ей) (?:пользовател|сотрудник)'
items:
  - id: PD-01
    property: SET-COMPL
    question: >-
      Перечислены обрабатываемые персональные и платёжные данные, цель их обработки и где они хранятся;
      система не собирает данных сверх цели?
    why: >-
      Без перечня нельзя проверить, что лишние данные не собираются и не уходят в смежные системы.
  - id: PD-02
    property: IND-COMPL
    question: >-
      Задан срок хранения данных и что с ними происходит по его истечении, при закрытии учётной записи
      или по отзыву согласия?
    why: >-
      Без срока и действия по его истечении удаление данных нечем проверить.
  - id: PD-03
    property: IND-COMPL
    question: >-
      Чувствительные данные (номер карты, документы, пароли, токены, коды подтверждения) маскируются в
      интерфейсе, сообщениях, журналах и выгрузках, и правило маскирования задано (что видно)?
    why: >-
      Тест на маскирование без правила не имеет ожидаемого результата, а утечка в журналы нарушает
      требования к защите платёжных данных.
  - id: PD-04
    property: SET-COMPL
    question: >-
      Определены роли и права: кто видит и кто меняет данные, и что происходит при попытке действия без
      прав?
    why: >-
      Без матрицы прав не написать негативные тесты доступа.
  - id: PD-05
    property: IND-COMPL
    question: >-
      Если документ касается передачи или хранения чувствительных данных: заданы ли защита канала и
      хранения и что пишется в журнал событий (и без каких данных)?
    why: >-
      Без этих требований безопасность нельзя проверить на приёмке.
  - id: PD-06
    property: SET-COMPL
    question: >-
      Если нужно согласие пользователя: когда оно берётся, как отзывается и что система делает без него?
    why: >-
      Сценарий без согласия или после отзыва не имеет ожидаемого результата.
