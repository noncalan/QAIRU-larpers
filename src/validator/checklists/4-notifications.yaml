# Доменный чек-лист: уведомления пользователю. Общие знания, без слов проверяемого документа
# (CLAUDE.md, правила 2 и 3). Формат файла и правила триггеров: README.md в этой папке.
id: NT
title: Уведомления
triggers:
  min_blocks: 2
  patterns:
    - '\bуведомл'
    - '\bоповещ'
    - '\bpush\b|\bпуш'
    - '(?-i:\b(?:SMS|СМС|смс)\b)'
    - '\bписьм[оае]'
    - '\bnotification'
    - '\bрассылк'
    - '\bнапоминани'
    - '\bсообщени(?:е|я|ю) (?:клиенту|пользователю|получателю)'
items:
  - id: NT-01
    property: IND-VERIF
    question: >-
      Для каждого уведомления заданы событие, которое его вызывает, получатель, канал и момент отправки
      (сразу, с задержкой, по расписанию) с измеримым сроком доставки?
    why: >-
      Без события, канала и срока отправку нельзя проверить тестом.
  - id: NT-02
    property: IND-COMPL
    question: >-
      Задан текст или шаблон уведомления с переменными, их формат (суммы, даты, маскирование) и язык, и
      что подставляется, если значения нет?
    why: >-
      Без шаблона тест не может сравнить фактический текст с ожидаемым.
  - id: NT-03
    property: IND-UNAMB
    question: >-
      Описаны правила частоты: сколько раз и как часто можно отправить уведомление об одном и том же,
      что сбрасывает ограничение, что при повторном событии?
    why: >-
      Без правила частоты тест на серию событий не имеет одного ожидаемого числа уведомлений.
  - id: NT-04
    property: SET-COMPL
    question: >-
      Что происходит, если пользователь отключил уведомления, изменил настройки между событиями, или канал
      недоступен (нет приложения, устаревший адрес доставки, не подтверждён номер): повтор, другой канал
      или отказ?
    why: >-
      Сценарии отказа доставки и смены настроек без правила не тестируются.
  - id: NT-05
    property: IND-VERIF
    question: >-
      Как подтвердить отправку и доставку в тесте: что система фиксирует (журнал, статус доставки) и
      по какому признаку уведомление считается доставленным?
    why: >-
      Без наблюдаемого признака тест не отличит отправленное уведомление от потерянного.
