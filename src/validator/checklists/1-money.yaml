# Доменный чек-лист: деньги и суммы. Общие знания платёжных систем, без слов проверяемого документа
# (CLAUDE.md, правила 2 и 3). Формат файла и правила триггеров: README.md в этой папке.
id: MON
title: Деньги и суммы
triggers:
  min_blocks: 2
  patterns:
    - '\bсумм'
    - '\bвалют'
    - '\bденеж'
    - '\bденьг'
    - '\bплат[её]ж'
    - '\bоплат'
    - '\bсписани'
    - '\bзачислени'
    - '\bкомисси'
    - '\bбаланс'
    - '\bтариф'
    - '\bстоимост'
    - '\bтенге\b'
    - '\bрубл'
    - '\bдоллар'
    - '\bевро\b'
    - '(?-i:\b(?:KZT|RUB|USD|EUR|GBP|CNY|UZS|KGS)\b)'
    - '[₸₽$€£]'
    - '\b(?:amount|currency|price|balance|fee)\b'
items:
  - id: MON-01
    property: SET-CONS
    question: >-
      Для каждой суммы указаны валюта и единица (основная единица или минимальная, например копейки
      или центы), и они одинаковы во всех местах: в тексте, таблицах, примерах, полях интерфейса и данных?
    why: >-
      Без единицы значение 100 можно прочитать как 100 единиц или как 1,00, и у теста нет одного
      ожидаемого результата.
  - id: MON-02
    property: IND-COMPL
    question: >-
      Заданы точность (сколько знаков после запятой) и правило округления (вверх, вниз, математическое,
      банковское), а также на каком шаге округлять: каждую операцию или итог?
    why: >-
      Расчёт с другим округлением расходится на минимальную единицу, и тест падает или проходит случайно.
  - id: MON-03
    property: IND-UNAMB
    question: >-
      Когда сумма сравнивается с пределом, сказано, входит ли само граничное значение («не более»,
      «превышает», «достигает»), и одинаково ли это во всех местах?
    why: >-
      Тест на ровно граничное значение без этого не имеет одного ожидаемого результата.
  - id: MON-04
    property: IND-COMPL
    question: >-
      Если суммы бывают в разных валютах: по какому курсу, на какой момент и чьему (банка, платёжной
      системы, центрального банка) сумма пересчитывается в валюту расчёта?
    why: >-
      Без курса и момента пересчёта нельзя посчитать ожидаемую сумму для операции в другой валюте.
  - id: MON-05
    property: IND-UNAMB
    question: >-
      Определено, какие операции входят в учитываемую сумму и какие нет (комиссии, отмены, возвраты,
      незавершённые операции, переводы между своими счетами), и как отмена или возврат меняют уже
      посчитанную сумму?
    why: >-
      Разработчик и тестировщик по-разному соберут сумму из одного набора операций.
  - id: MON-06
    property: IND-COMPL
    question: >-
      Заданы допустимые значения суммы (минимум, максимум, ноль, отрицательные, дробные) и реакция
      системы на значение вне диапазона?
    why: >-
      Без диапазона нельзя написать негативные тесты и тесты граничных значений.
