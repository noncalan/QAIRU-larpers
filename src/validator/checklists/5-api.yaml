# Доменный чек-лист: API и интеграции. Общие знания REST и обмена сообщениями, без слов проверяемого
# документа (CLAUDE.md, правила 2 и 3). Формат файла и правила триггеров: README.md в этой папке.
id: API
title: API и интеграции
triggers:
  min_blocks: 2
  patterns:
    - '(?-i:\b(?:GET|POST|PUT|PATCH|DELETE)\b)'
    - '\bendpoint'
    - '\bэндпоинт'
    - '(?-i:\b(?:API|REST|HTTPS?|JSON|XML|gRPC|SOAP)\b)'
    - '\bwebhook|\bвебхук'
    - '(?-i:\b[1-5]\d\d\s+(?:OK|Created|Accepted|No Content|Bad Request|Unauthorized|Forbidden|Not Found|Conflict|Unprocessable|Too Many|Internal|Bad Gateway|Service Unavailable|Gateway Timeout))'
    - '\bкод(?:ы|а|ом)? (?:ответа|ошибк|состояния HTTP)'
    - '\bинтеграц'
    - '\bочеред(?:ь|и|ью)\b'
    - '\bброкер'
    - '\b(?:kafka|rabbitmq)\b'
    - '\bсмежн(?:ой|ая|ую|ые|ых|ым) систем'
    - '\bвнешн(?:ей|ий|яя|юю|его|ему|их|ие) (?:систем|сервис)'
    - '\bзапрос[аеуы]? к\b'
items:
  - id: API-01
    property: IND-CORR
    question: >-
      Метод каждой операции соответствует её смыслу: чтение без побочных эффектов, создание, полная или
      частичная замена, удаление; изменяющая операция не описана через метод чтения?
    why: >-
      Операция, которая противоречит семантике протокола, ломает кеширование и повторы, а тест метода
      не совпадает с описанием.
  - id: API-02
    property: SET-COMPL
    question: >-
      Для каждой операции перечислены все ответы: успешный и каждый код ошибки с условием, при котором он
      возвращается, и телом ответа; перечень одинаков в описании, схеме и примерах?
    why: >-
      Негативный тест без кода ответа и условия не написать, а клиент не знает, что обрабатывать.
  - id: API-03
    property: IND-CORR
    question: >-
      Ошибка не возвращается с кодом успеха (2xx с ошибкой в теле), а коды ответов соответствуют
      общепринятой семантике HTTP (400, 401, 403, 404, 409, 422, 429, 5xx)?
    why: >-
      Клиент и мониторинг сочтут ошибку успехом, а ожидаемый код в тесте будет спорным.
  - id: API-04
    property: SET-CONS
    question: >-
      Для каждого поля запроса и ответа заданы тип, формат, единицы, обязательность и допустимые
      значения, и они совпадают в тексте, схеме и примерах?
    why: >-
      Расхождение типа или единиц поля между местами документа даёт две разные реализации.
  - id: API-05
    property: SET-COMPL
    question: >-
      Повтор запроса или сообщения (таймаут, повторная доставка) не создаёт дубля: задан ключ
      идемпотентности или правило дедупликации и ответ на повтор?
    why: >-
      Без правила повтора тест на повторную доставку не имеет ожидаемого результата, а в проде возможны
      двойные действия.
  - id: API-06
    property: SET-COMPL
    question: >-
      Описано поведение при недоступности или медленном ответе смежной системы: таймаут, число и интервал
      повторов, что видит пользователь и что происходит с данными?
    why: >-
      Сценарий отказа смежной системы нельзя протестировать, если реакция не задана.
  - id: API-07
    property: IND-COMPL
    question: >-
      Описан доступ: кто может вызывать операцию, как передаются учётные данные, что возвращается без
      прав или с чужим объектом; чувствительные идентификаторы не передаются в адресной строке (URL)?
    why: >-
      Без правил доступа не написать тесты безопасности, а данные из URL попадают в журналы и прокси.
  - id: API-08
    property: SET-COMPL
    question: >-
      Для асинхронных сообщений сказано: гарантирован ли порядок доставки, что делать с сообщением не по
      порядку, повторным или о неизвестном объекте?
    why: >-
      Без этих правил результат зависит от случайного порядка доставки, и тест нестабилен.
