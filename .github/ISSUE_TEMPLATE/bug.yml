name: Баг
description: Что-то работает не так
title: "[Баг] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Команда, входной файл, модель
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидалось и получилось
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Лог или трейсбек (без ключей!)
      render: text
