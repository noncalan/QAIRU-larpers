# Конфиг gitleaks для задачи secrets в CI (.github/workflows/ci.yml).
# Берём стандартные правила и разрешаем только шаблон ключей: .env.example без значений.
title = "QAIRU gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Шаблон переменных окружения: в нём пустые значения, реальные ключи только в .env (он в .gitignore)"
paths = ['''(^|/)\.env\.example$''']

[[allowlists]]
description = "Хеш-ключи кеша и записи вызовов модели и судьи (поле key в JSON/JSONL, run/calls.jsonl, run/responses/): это sha256, а не секрет"
condition = "AND"
paths = ['''^evals/(cache|results|holdout)/''', '''^tests/fixtures/''', '''^reports/''', '''^examples/''']
regexes = ['''^[0-9a-f]{64}$''']

[[allowlists]]
description = "Поле stable_key в отчётах (report.json), снапшотах (tests/fixtures/e2e) и записанных прогонах: 12 первых знаков sha256 нормализованной цитаты, а не секрет"
condition = "AND"
paths = ['''^tests/fixtures/''', '''^evals/(results|holdout)/''', '''^reports/''', '''^examples/''']
regexes = ['''^[0-9a-f]{12}$''']
