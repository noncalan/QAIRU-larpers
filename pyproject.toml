[project]
name = "qairu-validator"
version = "0.1.0"
description = "AI Requirements Validator: команда QAIRU larpers, BCC-HUB x MNU AI Agent Challenge 2026"
readme = "README.md"
requires-python = ">=3.11"
# Все зависимости агента кладёт каркас (#15), чтобы задачам волны 1 не пришлось трогать этот файл.
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "pymupdf>=1.24",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pikepdf>=9.0",
  "python-docx>=1.1",
  "razdel>=0.5",
  "rapidfuzz>=3.9",
  "charset-normalizer>=3.3",
  "filetype>=1.2",
  "msoffcrypto-tool>=5.4",
  "olefile>=0.47",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "typst>=0.12",
  "lxml>=5",
]

[project.scripts]
validator = "validator.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/validator"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]
# Для экспериментов фазы исследования: uv sync --group experiments
experiments = [
  "anthropic",
  "python-dotenv",
  "pymupdf4llm",
  "pdfplumber",
  "pypdf",
  "python-docx",
  "markitdown[pdf,docx]",
  "filetype",
  "charset-normalizer",
  "rapidfuzz",
  # Нужны генератору битых файлов и проверке на своей ОС (experiments/04-parsing-lab, 12-parsers-on-my-os)
  "pikepdf",
  "pypdfium2",
  "msoffcrypto-tool",
  "olefile",
  "psutil",
  # Стенд нарезки (experiments/18-segmentation)
  "razdel",
  "pyyaml",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["experiments", "docs", ".claude", "*.md"]  # ruff 0.17 форматирует и код в Markdown: документацию не трогаем

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "C4", "PIE", "RET", "S", "BLE"]
ignore = [
  "RUF001", "RUF002", "RUF003", # кириллица и типографика в строках и комментариях это норма для проекта
  "PLR2004",                    # магические числа в тестах; в коде держим константы сами
  "PLR0913", "PLR0917",         # шаги конвейера и команда CLI принимают несколько аргументов
  "PLR0911",                    # ранний return вместо лесенки if (правила Python проекта)
  "S603", "S607",               # subprocess: вызываем claude и git без shell, аргументы списком
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0915", "PLR2004", "S108"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["validator"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["razdel.*", "fitz.*", "pymupdf.*", "docx.*", "lxml.*", "rapidfuzz.*", "typst.*", "filetype.*", "pypdfium2.*"]
ignore_missing_imports = true

# У PyMuPDF типы частичные (Document не итерируемый, get_text без аннотаций): считаем модуль Any.
[[tool.mypy.overrides]]
module = ["fitz.*", "pymupdf.*"]
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
